<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โปรไฟล์ - ระบบจัดการนักศึกษาฝึกงาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spinner { border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s; }
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  </style>
</head>
<body class="bg-gray-50">

  <div id="toast" class="hidden fixed top-4 right-4 z-50 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg toast"></div>

  <!-- Sidebar -->
  <div id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white shadow-lg z-30">
    <div class="p-6 border-b">
      <h1 class="text-lg font-bold text-blue-700">ระบบจัดการฝึกงาน</h1>
    </div>
    <nav class="p-4" id="nav-menu"></nav>
  </div>

  <!-- Main -->
  <div class="ml-64">
    <div class="bg-white shadow-sm px-6 py-3 flex justify-between items-center sticky top-0 z-20">
      <h2 class="text-lg font-semibold" id="page-title">โปรไฟล์</h2>
      <div class="flex items-center gap-4">
        <span id="user-name" class="text-sm text-gray-600"></span>
        <span id="user-role" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full"></span>
        <button onclick="logout()" class="text-sm text-red-600 hover:text-red-800">ออกจากระบบ</button>
      </div>
    </div>

    <div class="p-6" id="content">
      <div class="flex items-center justify-center h-64">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <script>
    var currentUser = null;
    var scriptUrl = '';

    function initPage() {
      google.script.run.withSuccessHandler(function(url) { scriptUrl = url; }).getScriptUrl();
      google.script.run.withSuccessHandler(function(user) {
        if (!user) { navigateTo('login'); return; }
        currentUser = user;
        document.getElementById('user-name').textContent = user.name;
        document.getElementById('user-role').textContent = getRoleLabel(user.role);
        buildNavMenu(user.role);
        loadPageData();
      }).withFailureHandler(function() { navigateTo('login'); }).getCurrentUser();
    }

    function navigateTo(page) {
      google.script.run.withSuccessHandler(function(url) {
        window.top.location.href = url + '?page=' + page;
      }).getScriptUrl();
    }

    function logout() {
      google.script.run.withSuccessHandler(function() { navigateTo('login'); }).logout();
    }

    function getRoleLabel(role) {
      return { STUDENT: 'นักศึกษา', MENTOR: 'พี่เลี้ยง', ADMIN: 'ผู้ดูแลระบบ' }[role] || role;
    }

    function buildNavMenu(role) {
      var menus = {
        ADMIN: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'จัดการนักศึกษา', page: 'admin-students', icon: '👨‍🎓' },
          { label: 'จัดการพี่เลี้ยง', page: 'admin-mentors', icon: '👨‍🏫' },
          { label: 'จัดการ Roadmap', page: 'admin-roadmaps', icon: '🗺️' },
          { label: 'จัดการงาน', page: 'admin-assignments', icon: '📝' },
          { label: 'ผลประเมิน', page: 'admin-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'admin-resources', icon: '📚' },
          { label: 'แจ้งเตือน', page: 'admin-notifications', icon: '🔔' }
        ],
        STUDENT: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'โปรไฟล์', page: 'student-profile', icon: '👤' },
          { label: 'Roadmap', page: 'student-roadmap', icon: '🗺️' },
          { label: 'งานที่ได้รับ', page: 'student-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'student-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'student-resources', icon: '📚' }
        ],
        MENTOR: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'นักศึกษาในดูแล', page: 'mentor-students', icon: '👨‍🎓' },
          { label: 'ตรวจงาน', page: 'mentor-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'mentor-evaluations', icon: '⭐' }
        ]
      };
      var items = menus[role] || [];
      var nav = document.getElementById('nav-menu');
      nav.innerHTML = items.map(function(item) {
        var active = item.page === 'student-profile' ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-gray-600 hover:bg-gray-50';
        return '<a href="#" onclick="navigateTo(\'' + item.page + '\')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg mb-1 text-sm ' + active + '">' +
          '<span>' + item.icon + '</span><span>' + item.label + '</span></a>';
      }).join('');
    }

    function showToast(msg, isError) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg toast ' + (isError ? 'bg-red-500 text-white' : 'bg-green-500 text-white');
      setTimeout(function() { toast.className = 'hidden'; }, 3000);
    }

    function loadPageData() {
      google.script.run.withSuccessHandler(function(profile) {
        if (!profile) profile = {};
        var content = document.getElementById('content');
        content.innerHTML =
          '<div class="max-w-2xl mx-auto">' +
          '<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">' +
          '<div class="flex items-center gap-4 mb-6 pb-6 border-b">' +
          '<div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-2xl">👤</div>' +
          '<div><h3 class="text-xl font-bold text-gray-800">' + (profile.name || currentUser.name) + '</h3>' +
          '<p class="text-sm text-gray-500">' + (profile.email || currentUser.email || '') + '</p></div></div>' +
          '<form id="profile-form" onsubmit="saveProfile(event)">' +
          '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">' +
          formField('ชื่อ-นามสกุล', 'name', profile.name || '') +
          formField('เบอร์โทรศัพท์', 'phone', profile.phone || '') +
          formField('มหาวิทยาลัย', 'university', profile.university || '') +
          formField('คณะ', 'faculty', profile.faculty || '') +
          formField('สาขา', 'major', profile.major || '') +
          '<div><label class="block text-sm font-medium text-gray-700 mb-1">ชั้นปี</label>' +
          '<select id="year" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">' +
          '<option value="">เลือกชั้นปี</option>' +
          [1,2,3,4,5].map(function(y) { return '<option value="' + y + '"' + (String(profile.year) === String(y) ? ' selected' : '') + '>ปี ' + y + '</option>'; }).join('') +
          '</select></div>' +
          formField('บริษัทฝึกงาน', 'company', profile.company || '') +
          formField('แผนก', 'department', profile.department || '') +
          '</div>' +
          '<div class="mt-6 flex justify-end">' +
          '<button type="submit" id="save-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-lg transition">บันทึกข้อมูล</button>' +
          '</div></form></div></div>';
      }).withFailureHandler(function(err) {
        document.getElementById('content').innerHTML = '<p class="text-red-500 text-center">ไม่สามารถโหลดข้อมูลได้: ' + err.message + '</p>';
      }).getUserProfile(currentUser.userId);
    }

    function formField(label, id, value) {
      return '<div><label class="block text-sm font-medium text-gray-700 mb-1">' + label + '</label>' +
        '<input type="text" id="' + id + '" value="' + escapeHtml(value) + '" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"></div>';
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function saveProfile(e) {
      e.preventDefault();
      var btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึก...';

      var data = {
        name: document.getElementById('name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        university: document.getElementById('university').value.trim(),
        faculty: document.getElementById('faculty').value.trim(),
        major: document.getElementById('major').value.trim(),
        year: document.getElementById('year').value,
        company: document.getElementById('company').value.trim(),
        department: document.getElementById('department').value.trim()
      };

      google.script.run.withSuccessHandler(function(result) {
        btn.disabled = false;
        btn.textContent = 'บันทึกข้อมูล';
        if (result && result.success) {
          showToast('บันทึกข้อมูลสำเร็จ');
        } else {
          showToast(result && result.message ? result.message : 'ไม่สามารถบันทึกได้', true);
        }
      }).withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = 'บันทึกข้อมูล';
        showToast('เกิดข้อผิดพลาด: ' + err.message, true);
      }).updateProfile(currentUser.userId, data);
    }

    window.onload = initPage;
  </script>
</body>
</html>
