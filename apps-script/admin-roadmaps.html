<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการ Roadmap - ระบบจัดการนักศึกษาฝึกงาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spinner { border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s; }
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    .modal-overlay { background: rgba(0,0,0,0.5); }
  </style>
</head>
<body class="bg-gray-50">

  <div id="toast" class="hidden fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg toast"></div>

  <!-- Sidebar -->
  <div id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white shadow-lg z-30">
    <div class="p-6 border-b">
      <h1 class="text-lg font-bold text-blue-700">ระบบจัดการฝึกงาน</h1>
    </div>
    <nav class="p-4" id="nav-menu"></nav>
  </div>

  <!-- Main -->
  <div class="ml-64">
    <div class="bg-white shadow-sm px-6 py-3 flex justify-between items-center sticky top-0 z-20">
      <h2 class="text-lg font-semibold" id="page-title">จัดการ Roadmap</h2>
      <div class="flex items-center gap-4">
        <span id="user-name" class="text-sm text-gray-600"></span>
        <span id="user-role" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full"></span>
        <button onclick="logout()" class="text-sm text-red-600 hover:text-red-800">ออกจากระบบ</button>
      </div>
    </div>

    <div class="p-6" id="content">
      <div class="flex items-center justify-center h-64"><div class="spinner"></div></div>
    </div>
  </div>

  <script>
    var currentUser = null;
    var scriptUrl = '';
    var roadmapsList = [];

    function initPage() {
      google.script.run.withSuccessHandler(function(url) { scriptUrl = url; }).getScriptUrl();
      google.script.run.withSuccessHandler(function(user) {
        if (!user) { navigateTo('login'); return; }
        currentUser = user;
        document.getElementById('user-name').textContent = user.name;
        document.getElementById('user-role').textContent = getRoleLabel(user.role);
        buildNavMenu(user.role);
        loadPageData();
      }).withFailureHandler(function() { navigateTo('login'); }).getCurrentUser();
    }

    function navigateTo(page) { google.script.run.withSuccessHandler(function(url) { window.top.location.href = url + '?page=' + page; }).getScriptUrl(); }
    function logout() { google.script.run.withSuccessHandler(function() { navigateTo('login'); }).logout(); }
    function getRoleLabel(role) { return { STUDENT: 'นักศึกษา', MENTOR: 'พี่เลี้ยง', ADMIN: 'ผู้ดูแลระบบ' }[role] || role; }

    function buildNavMenu(role) {
      var menus = {
        ADMIN: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'จัดการนักศึกษา', page: 'admin-students', icon: '👨‍🎓' },
          { label: 'จัดการพี่เลี้ยง', page: 'admin-mentors', icon: '👨‍🏫' },
          { label: 'จัดการ Roadmap', page: 'admin-roadmaps', icon: '🗺️' },
          { label: 'จัดการงาน', page: 'admin-assignments', icon: '📝' },
          { label: 'ผลประเมิน', page: 'admin-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'admin-resources', icon: '📚' },
          { label: 'แจ้งเตือน', page: 'admin-notifications', icon: '🔔' }
        ],
        STUDENT: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'โปรไฟล์', page: 'student-profile', icon: '👤' },
          { label: 'Roadmap', page: 'student-roadmap', icon: '🗺️' },
          { label: 'งานที่ได้รับ', page: 'student-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'student-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'student-resources', icon: '📚' }
        ],
        MENTOR: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'นักศึกษาในดูแล', page: 'mentor-students', icon: '👨‍🎓' },
          { label: 'ตรวจงาน', page: 'mentor-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'mentor-evaluations', icon: '⭐' }
        ]
      };
      var items = menus[role] || [];
      var nav = document.getElementById('nav-menu');
      nav.innerHTML = items.map(function(item) {
        var active = item.page === 'admin-roadmaps' ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-gray-600 hover:bg-gray-50';
        return '<a href="#" onclick="navigateTo(\'' + item.page + '\')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg mb-1 text-sm ' + active + '">' +
          '<span>' + item.icon + '</span><span>' + item.label + '</span></a>';
      }).join('');
    }

    function showToast(msg, isError) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg toast ' + (isError ? 'bg-red-500 text-white' : 'bg-green-500 text-white');
      setTimeout(function() { toast.className = 'hidden'; }, 3000);
    }

    function loadPageData() {
      google.script.run.withSuccessHandler(function(list) {
        roadmapsList = list || [];
        renderPage();
      }).withFailureHandler(function() {
        document.getElementById('content').innerHTML = '<p class="text-red-500 text-center">ไม่สามารถโหลดข้อมูลได้</p>';
      }).getRoadmaps();
    }

    function renderPage() {
      var html = '<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">';

      // Create form
      html += '<div class="lg:col-span-1">' +
        '<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 sticky top-20">' +
        '<h3 class="text-lg font-bold text-gray-800 mb-4">สร้าง Roadmap ใหม่</h3>' +
        '<form id="create-form" onsubmit="createRoadmap(event)">' +
        '<div class="space-y-3">' +
        '<div><label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ Roadmap</label><input type="text" id="rm-title" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"></div>' +
        '<div><label class="block text-sm font-medium text-gray-700 mb-1">คำอธิบาย</label><textarea id="rm-description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"></textarea></div>' +
        '<div><label class="block text-sm font-medium text-gray-700 mb-1">หมวดหมู่</label><input type="text" id="rm-category" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="เช่น พัฒนาซอฟต์แวร์"></div>' +
        '</div>' +
        '<button type="submit" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition text-sm">สร้าง Roadmap</button>' +
        '</form></div></div>';

      // Roadmaps list
      html += '<div class="lg:col-span-2"><div class="space-y-4">';

      if (!roadmapsList.length) {
        html += '<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center"><p class="text-gray-400">ยังไม่มี Roadmap</p></div>';
      } else {
        roadmapsList.forEach(function(rm, idx) {
          var steps = rm.steps || [];
          html += '<div class="bg-white rounded-xl shadow-sm border border-gray-100">' +
            '<div class="p-5 cursor-pointer" onclick="toggleRoadmap(' + idx + ')">' +
            '<div class="flex items-center justify-between">' +
            '<div><h4 class="font-bold text-gray-800">' + escapeHtml(rm.title || '') + '</h4>' +
            '<p class="text-sm text-gray-500 mt-1">' + escapeHtml(rm.description || '') + '</p>' +
            '<div class="flex gap-2 mt-2">' +
            (rm.category ? '<span class="text-xs bg-blue-50 text-blue-600 px-2 py-0.5 rounded">' + escapeHtml(rm.category) + '</span>' : '') +
            '<span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded">' + steps.length + ' ขั้นตอน</span>' +
            '</div></div>' +
            '<svg class="w-5 h-5 text-gray-400 transform transition-transform" id="arrow-' + idx + '" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>' +
            '</div></div>' +
            '<div id="steps-' + idx + '" class="hidden border-t p-5">';

          // Steps list
          if (steps.length) {
            steps.forEach(function(step, si) {
              html += '<div class="flex items-center gap-3 py-2 ' + (si < steps.length - 1 ? 'border-b border-gray-100' : '') + '">' +
                '<span class="w-6 h-6 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0">' + (si + 1) + '</span>' +
                '<div class="flex-1">' +
                '<p class="text-sm font-medium text-gray-800">' + escapeHtml(step.title || '') + '</p>' +
                '<p class="text-xs text-gray-400">' + escapeHtml(step.description || '') + (step.durationDays ? ' | ' + step.durationDays + ' วัน' : '') + '</p>' +
                '</div>' +
                '<button onclick="deleteStep(\'' + rm.roadmapId + '\', \'' + step.stepId + '\')" class="text-red-400 hover:text-red-600 text-xs">ลบ</button>' +
                '</div>';
            });
          }

          // Add step form
          html += '<div class="mt-4 pt-4 border-t border-gray-200">' +
            '<h5 class="text-sm font-semibold text-gray-700 mb-2">เพิ่มขั้นตอน</h5>' +
            '<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">' +
            '<input type="text" id="step-title-' + idx + '" placeholder="ชื่อขั้นตอน" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">' +
            '<input type="text" id="step-desc-' + idx + '" placeholder="คำอธิบาย" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">' +
            '<div class="flex gap-2">' +
            '<input type="number" id="step-days-' + idx + '" placeholder="จำนวนวัน" min="1" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">' +
            '<button onclick="addStep(\'' + rm.roadmapId + '\', ' + idx + ')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm whitespace-nowrap">เพิ่ม</button>' +
            '</div></div></div>';

          html += '</div></div>';
        });
      }

      html += '</div></div></div>';
      document.getElementById('content').innerHTML = html;
    }

    function toggleRoadmap(idx) {
      var el = document.getElementById('steps-' + idx);
      var arrow = document.getElementById('arrow-' + idx);
      el.classList.toggle('hidden');
      arrow.classList.toggle('rotate-180');
    }

    function createRoadmap(e) {
      e.preventDefault();
      var data = {
        title: document.getElementById('rm-title').value.trim(),
        description: document.getElementById('rm-description').value.trim(),
        category: document.getElementById('rm-category').value.trim()
      };

      google.script.run.withSuccessHandler(function(result) {
        if (result && result.success) {
          showToast('สร้าง Roadmap สำเร็จ');
          document.getElementById('create-form').reset();
          loadPageData();
        } else { showToast(result && result.message ? result.message : 'ไม่สามารถสร้างได้', true); }
      }).withFailureHandler(function(err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message, true);
      }).createRoadmap(data);
    }

    function addStep(roadmapId, idx) {
      var data = {
        roadmapId: roadmapId,
        title: document.getElementById('step-title-' + idx).value.trim(),
        description: document.getElementById('step-desc-' + idx).value.trim(),
        durationDays: parseInt(document.getElementById('step-days-' + idx).value) || 0
      };

      if (!data.title) { showToast('กรุณากรอกชื่อขั้นตอน', true); return; }

      google.script.run.withSuccessHandler(function(result) {
        if (result && result.success) {
          showToast('เพิ่มขั้นตอนสำเร็จ');
          loadPageData();
        } else { showToast('ไม่สามารถเพิ่มได้', true); }
      }).withFailureHandler(function(err) {
        showToast('เกิดข้อผิดพลาด', true);
      }).addRoadmapStep(data);
    }

    function deleteStep(roadmapId, stepId) {
      if (!confirm('ต้องการลบขั้นตอนนี้?')) return;
      google.script.run.withSuccessHandler(function(result) {
        if (result && result.success) {
          showToast('ลบขั้นตอนสำเร็จ');
          loadPageData();
        } else { showToast('ไม่สามารถลบได้', true); }
      }).withFailureHandler(function(err) {
        showToast('เกิดข้อผิดพลาด', true);
      }).deleteRoadmapStep(roadmapId, stepId);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    window.onload = initPage;
  </script>
</body>
</html>
