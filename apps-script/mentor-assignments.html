<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจงาน - ระบบจัดการนักศึกษาฝึกงาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spinner { border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s; }
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    .modal-overlay { background: rgba(0,0,0,0.5); }
  </style>
</head>
<body class="bg-gray-50">

  <div id="toast" class="hidden fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg toast"></div>

  <!-- Sidebar -->
  <div id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white shadow-lg z-30">
    <div class="p-6 border-b"><h1 class="text-lg font-bold text-blue-700">ระบบจัดการฝึกงาน</h1></div>
    <nav class="p-4" id="nav-menu"></nav>
  </div>

  <!-- Main -->
  <div class="ml-64">
    <div class="bg-white shadow-sm px-6 py-3 flex justify-between items-center sticky top-0 z-20">
      <h2 class="text-lg font-semibold" id="page-title">ตรวจงาน</h2>
      <div class="flex items-center gap-4">
        <span id="user-name" class="text-sm text-gray-600"></span>
        <span id="user-role" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full"></span>
        <button onclick="logout()" class="text-sm text-red-600 hover:text-red-800">ออกจากระบบ</button>
      </div>
    </div>
    <div class="p-6" id="content">
      <div class="flex items-center justify-center h-64"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- Review Modal -->
  <div id="review-modal" class="hidden fixed inset-0 z-40 flex items-center justify-center modal-overlay">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg p-6 m-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-gray-800">ตรวจงาน</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
      </div>
      <div id="review-submission-info" class="mb-4"></div>
      <form id="review-form" onsubmit="submitReview(event)">
        <input type="hidden" id="review-sub-id">
        <div class="space-y-3">
          <div><label class="block text-sm font-medium text-gray-700 mb-1">คะแนน</label>
            <input type="number" id="review-score" required min="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
          </div>
          <div><label class="block text-sm font-medium text-gray-700 mb-1">ความคิดเห็น</label>
            <textarea id="review-feedback" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="ความคิดเห็นเกี่ยวกับงาน..."></textarea>
          </div>
          <div class="flex gap-3">
            <button type="submit" name="action" value="approve" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition text-sm" onclick="document.getElementById('review-action').value='APPROVED'">อนุมัติ</button>
            <button type="submit" name="action" value="revision" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2.5 rounded-lg transition text-sm" onclick="document.getElementById('review-action').value='REVISION_REQUESTED'">ขอแก้ไข</button>
          </div>
          <input type="hidden" id="review-action" value="APPROVED">
        </div>
      </form>
    </div>
  </div>

  <script>
    var currentUser = null;
    var scriptUrl = '';
    var submissionsList = [];
    var filterStatus = 'all';

    function initPage() {
      google.script.run.withSuccessHandler(function(url) { scriptUrl = url; }).getScriptUrl();
      google.script.run.withSuccessHandler(function(user) {
        if (!user) { navigateTo('login'); return; }
        currentUser = user;
        document.getElementById('user-name').textContent = user.name;
        document.getElementById('user-role').textContent = getRoleLabel(user.role);
        buildNavMenu(user.role);
        loadPageData();
      }).withFailureHandler(function() { navigateTo('login'); }).getCurrentUser();
    }

    function navigateTo(page) { google.script.run.withSuccessHandler(function(url) { window.top.location.href = url + '?page=' + page; }).getScriptUrl(); }
    function logout() { google.script.run.withSuccessHandler(function() { navigateTo('login'); }).logout(); }
    function getRoleLabel(role) { return { STUDENT: 'นักศึกษา', MENTOR: 'พี่เลี้ยง', ADMIN: 'ผู้ดูแลระบบ' }[role] || role; }

    function buildNavMenu(role) {
      var menus = {
        ADMIN: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'จัดการนักศึกษา', page: 'admin-students', icon: '👨‍🎓' },
          { label: 'จัดการพี่เลี้ยง', page: 'admin-mentors', icon: '👨‍🏫' },
          { label: 'จัดการ Roadmap', page: 'admin-roadmaps', icon: '🗺️' },
          { label: 'จัดการงาน', page: 'admin-assignments', icon: '📝' },
          { label: 'ผลประเมิน', page: 'admin-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'admin-resources', icon: '📚' },
          { label: 'แจ้งเตือน', page: 'admin-notifications', icon: '🔔' }
        ],
        STUDENT: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'โปรไฟล์', page: 'student-profile', icon: '👤' },
          { label: 'Roadmap', page: 'student-roadmap', icon: '🗺️' },
          { label: 'งานที่ได้รับ', page: 'student-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'student-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'student-resources', icon: '📚' }
        ],
        MENTOR: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'นักศึกษาในดูแล', page: 'mentor-students', icon: '👨‍🎓' },
          { label: 'ตรวจงาน', page: 'mentor-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'mentor-evaluations', icon: '⭐' }
        ]
      };
      var items = menus[role] || [];
      var nav = document.getElementById('nav-menu');
      nav.innerHTML = items.map(function(item) {
        var active = item.page === 'mentor-assignments' ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-gray-600 hover:bg-gray-50';
        return '<a href="#" onclick="navigateTo(\'' + item.page + '\')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg mb-1 text-sm ' + active + '">' +
          '<span>' + item.icon + '</span><span>' + item.label + '</span></a>';
      }).join('');
    }

    function showToast(msg, isError) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg toast ' + (isError ? 'bg-red-500 text-white' : 'bg-green-500 text-white');
      setTimeout(function() { toast.className = 'hidden'; }, 3000);
    }

    function openModal() { document.getElementById('review-modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('review-modal').classList.add('hidden'); }

    function getStatusInfo(status) {
      var map = {
        'SUBMITTED': { label: 'ส่งแล้ว', cls: 'bg-blue-100 text-blue-700' },
        'REVIEWED': { label: 'ตรวจแล้ว', cls: 'bg-purple-100 text-purple-700' },
        'APPROVED': { label: 'อนุมัติ', cls: 'bg-green-100 text-green-700' },
        'REVISION_REQUESTED': { label: 'ขอแก้ไข', cls: 'bg-orange-100 text-orange-700' }
      };
      return map[status] || { label: status, cls: 'bg-gray-100 text-gray-700' };
    }

    function loadPageData() {
      google.script.run.withSuccessHandler(function(subs) {
        submissionsList = subs || [];
        renderSubmissions();
      }).withFailureHandler(function() {
        document.getElementById('content').innerHTML = '<p class="text-red-500 text-center">ไม่สามารถโหลดข้อมูลได้</p>';
      }).getSubmissions({ mentorId: currentUser.userId });
    }

    function renderSubmissions() {
      var filtered = submissionsList;
      if (filterStatus !== 'all') {
        filtered = submissionsList.filter(function(s) { return s.status === filterStatus; });
      }

      var statuses = ['all', 'SUBMITTED', 'APPROVED', 'REVISION_REQUESTED', 'REVIEWED'];
      var statusLabels = { all: 'ทั้งหมด', SUBMITTED: 'รอตรวจ', APPROVED: 'อนุมัติ', REVISION_REQUESTED: 'ขอแก้ไข', REVIEWED: 'ตรวจแล้ว' };

      var html = '<div class="flex items-center gap-4 mb-6 flex-wrap">' +
        '<h3 class="text-lg font-bold text-gray-800">การส่งงานทั้งหมด</h3>' +
        '<div class="flex gap-2">';

      statuses.forEach(function(s) {
        var active = s === filterStatus ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border border-gray-300';
        html += '<button onclick="setFilter(\'' + s + '\')" class="px-3 py-1.5 rounded-lg text-sm transition ' + active + '">' + statusLabels[s] + '</button>';
      });

      html += '</div></div>';

      html += '<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden"><div class="overflow-x-auto"><table class="w-full">' +
        '<thead><tr class="bg-gray-50 text-left text-sm text-gray-500">' +
        '<th class="px-6 py-3 font-medium">นักศึกษา</th>' +
        '<th class="px-6 py-3 font-medium">ชื่องาน</th>' +
        '<th class="px-6 py-3 font-medium">วันที่ส่ง</th>' +
        '<th class="px-6 py-3 font-medium">สถานะ</th>' +
        '<th class="px-6 py-3 font-medium">คะแนน</th>' +
        '<th class="px-6 py-3 font-medium">การดำเนินการ</th>' +
        '</tr></thead><tbody>';

      if (!filtered.length) {
        html += '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-400">ไม่พบการส่งงาน</td></tr>';
      } else {
        filtered.forEach(function(s) {
          var st = getStatusInfo(s.status);
          html += '<tr class="border-t border-gray-100 hover:bg-gray-50">' +
            '<td class="px-6 py-3 text-sm font-medium text-gray-800">' + escapeHtml(s.studentName || s.userId || '') + '</td>' +
            '<td class="px-6 py-3 text-sm text-gray-600">' + escapeHtml(s.assignmentTitle || s.assignmentId || '') + '</td>' +
            '<td class="px-6 py-3 text-sm text-gray-500">' + (s.submittedAt || s.createdAt || '-') + '</td>' +
            '<td class="px-6 py-3"><span class="text-xs px-2 py-1 rounded-full ' + st.cls + '">' + st.label + '</span></td>' +
            '<td class="px-6 py-3 text-sm text-gray-600">' + (s.score !== undefined && s.score !== null ? s.score : '-') + '</td>' +
            '<td class="px-6 py-3"><button onclick="openReview(\'' + s.submissionId + '\')" class="text-blue-600 hover:text-blue-800 text-sm">ตรวจ</button></td>' +
            '</tr>';
        });
      }

      html += '</tbody></table></div></div>';
      document.getElementById('content').innerHTML = html;
    }

    function setFilter(status) {
      filterStatus = status;
      renderSubmissions();
    }

    function openReview(submissionId) {
      var s = submissionsList.find(function(sub) { return sub.submissionId === submissionId; });
      if (!s) return;

      document.getElementById('review-sub-id').value = submissionId;
      document.getElementById('review-score').value = s.score || '';
      document.getElementById('review-feedback').value = s.feedback || '';

      var info = '<div class="bg-gray-50 rounded-lg p-4 space-y-2">' +
        '<p class="text-sm"><span class="font-medium text-gray-700">นักศึกษา:</span> ' + escapeHtml(s.studentName || s.userId || '') + '</p>' +
        '<p class="text-sm"><span class="font-medium text-gray-700">งาน:</span> ' + escapeHtml(s.assignmentTitle || s.assignmentId || '') + '</p>' +
        '<p class="text-sm"><span class="font-medium text-gray-700">เนื้อหา:</span> ' + escapeHtml(s.content || '-') + '</p>' +
        (s.fileUrl ? '<p class="text-sm"><a href="' + escapeHtml(s.fileUrl) + '" target="_blank" class="text-blue-600 hover:underline">ดูไฟล์แนบ</a></p>' : '') +
        '</div>';

      document.getElementById('review-submission-info').innerHTML = info;
      openModal();
    }

    function submitReview(e) {
      e.preventDefault();
      var data = {
        submissionId: document.getElementById('review-sub-id').value,
        score: parseInt(document.getElementById('review-score').value) || 0,
        feedback: document.getElementById('review-feedback').value.trim(),
        status: document.getElementById('review-action').value
      };

      google.script.run.withSuccessHandler(function(result) {
        if (result && result.success) {
          showToast('บันทึกผลการตรวจสำเร็จ');
          closeModal();
          loadPageData();
        } else { showToast(result && result.message ? result.message : 'ไม่สามารถบันทึกได้', true); }
      }).withFailureHandler(function(err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message, true);
      }).reviewSubmission(data);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    window.onload = initPage;
  </script>
</body>
</html>
