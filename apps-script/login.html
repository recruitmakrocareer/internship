<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - ระบบจัดการนักศึกษาฝึกงาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spinner { border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-600 via-blue-700 to-blue-900 flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">ระบบจัดการนักศึกษาฝึกงาน</h1>
      <p class="text-gray-500 mt-1">เข้าสู่ระบบเพื่อดำเนินการต่อ</p>
    </div>

    <div id="error-msg" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm"></div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล</label>
        <input type="email" id="email" required
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
          placeholder="your@email.com">
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label>
        <input type="password" id="password" required
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
          placeholder="รหัสผ่านของคุณ">
      </div>

      <button type="submit" id="login-btn"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-2">
        <span id="btn-text">เข้าสู่ระบบ</span>
        <span id="btn-spinner" class="spinner hidden"></span>
      </button>
    </form>

    <div class="mt-6 text-center">
      <p class="text-sm text-gray-500">ยังไม่มีบัญชี?
        <a href="#" onclick="navigateTo('register')" class="text-blue-600 hover:text-blue-800 font-medium">สมัครสมาชิก</a>
      </p>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      if (!email || !password) return;

      setLoading(true);
      hideError();

      google.script.run
        .withSuccessHandler(function(result) {
          setLoading(false);
          if (result && result.success) {
            google.script.run.withSuccessHandler(function(url) {
              window.top.location.href = url + '?page=dashboard';
            }).getScriptUrl();
          } else {
            showError(result && result.message ? result.message : 'อีเมลหรือรหัสผ่านไม่ถูกต้อง');
          }
        })
        .withFailureHandler(function(err) {
          setLoading(false);
          showError('เกิดข้อผิดพลาด: ' + (err.message || 'กรุณาลองใหม่อีกครั้ง'));
        })
        .login(email, password);
    }

    function setLoading(loading) {
      var btn = document.getElementById('login-btn');
      var btnText = document.getElementById('btn-text');
      var spinner = document.getElementById('btn-spinner');
      btn.disabled = loading;
      btnText.textContent = loading ? 'กำลังเข้าสู่ระบบ...' : 'เข้าสู่ระบบ';
      spinner.classList.toggle('hidden', !loading);
      btn.classList.toggle('opacity-75', loading);
    }

    function showError(msg) {
      var el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('error-msg').classList.add('hidden');
    }

    function navigateTo(page) {
      google.script.run.withSuccessHandler(function(url) {
        window.top.location.href = url + '?page=' + page;
      }).getScriptUrl();
    }
  </script>
</body>
</html>
