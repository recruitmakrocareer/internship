<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadmap - ระบบจัดการนักศึกษาฝึกงาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spinner { border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s; }
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  </style>
</head>
<body class="bg-gray-50">

  <div id="toast" class="hidden fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg toast"></div>

  <!-- Sidebar -->
  <div id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white shadow-lg z-30">
    <div class="p-6 border-b">
      <h1 class="text-lg font-bold text-blue-700">ระบบจัดการฝึกงาน</h1>
    </div>
    <nav class="p-4" id="nav-menu"></nav>
  </div>

  <!-- Main -->
  <div class="ml-64">
    <div class="bg-white shadow-sm px-6 py-3 flex justify-between items-center sticky top-0 z-20">
      <h2 class="text-lg font-semibold" id="page-title">Roadmap การฝึกงาน</h2>
      <div class="flex items-center gap-4">
        <span id="user-name" class="text-sm text-gray-600"></span>
        <span id="user-role" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full"></span>
        <button onclick="logout()" class="text-sm text-red-600 hover:text-red-800">ออกจากระบบ</button>
      </div>
    </div>

    <div class="p-6" id="content">
      <div class="flex items-center justify-center h-64">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <script>
    var currentUser = null;
    var scriptUrl = '';
    var roadmaps = [];
    var progressData = {};

    function initPage() {
      google.script.run.withSuccessHandler(function(url) { scriptUrl = url; }).getScriptUrl();
      google.script.run.withSuccessHandler(function(user) {
        if (!user) { navigateTo('login'); return; }
        currentUser = user;
        document.getElementById('user-name').textContent = user.name;
        document.getElementById('user-role').textContent = getRoleLabel(user.role);
        buildNavMenu(user.role);
        loadPageData();
      }).withFailureHandler(function() { navigateTo('login'); }).getCurrentUser();
    }

    function navigateTo(page) {
      google.script.run.withSuccessHandler(function(url) {
        window.top.location.href = url + '?page=' + page;
      }).getScriptUrl();
    }

    function logout() {
      google.script.run.withSuccessHandler(function() { navigateTo('login'); }).logout();
    }

    function getRoleLabel(role) {
      return { STUDENT: 'นักศึกษา', MENTOR: 'พี่เลี้ยง', ADMIN: 'ผู้ดูแลระบบ' }[role] || role;
    }

    function buildNavMenu(role) {
      var menus = {
        ADMIN: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'จัดการนักศึกษา', page: 'admin-students', icon: '👨‍🎓' },
          { label: 'จัดการพี่เลี้ยง', page: 'admin-mentors', icon: '👨‍🏫' },
          { label: 'จัดการ Roadmap', page: 'admin-roadmaps', icon: '🗺️' },
          { label: 'จัดการงาน', page: 'admin-assignments', icon: '📝' },
          { label: 'ผลประเมิน', page: 'admin-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'admin-resources', icon: '📚' },
          { label: 'แจ้งเตือน', page: 'admin-notifications', icon: '🔔' }
        ],
        STUDENT: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'โปรไฟล์', page: 'student-profile', icon: '👤' },
          { label: 'Roadmap', page: 'student-roadmap', icon: '🗺️' },
          { label: 'งานที่ได้รับ', page: 'student-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'student-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'student-resources', icon: '📚' }
        ],
        MENTOR: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'นักศึกษาในดูแล', page: 'mentor-students', icon: '👨‍🎓' },
          { label: 'ตรวจงาน', page: 'mentor-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'mentor-evaluations', icon: '⭐' }
        ]
      };
      var items = menus[role] || [];
      var nav = document.getElementById('nav-menu');
      nav.innerHTML = items.map(function(item) {
        var active = item.page === 'student-roadmap' ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-gray-600 hover:bg-gray-50';
        return '<a href="#" onclick="navigateTo(\'' + item.page + '\')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg mb-1 text-sm ' + active + '">' +
          '<span>' + item.icon + '</span><span>' + item.label + '</span></a>';
      }).join('');
    }

    function showToast(msg, isError) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg toast ' + (isError ? 'bg-red-500 text-white' : 'bg-green-500 text-white');
      setTimeout(function() { toast.className = 'hidden'; }, 3000);
    }

    function loadPageData() {
      var content = document.getElementById('content');
      content.innerHTML = '<div class="flex items-center justify-center h-64"><div class="spinner"></div></div>';

      google.script.run.withSuccessHandler(function(rmaps) {
        roadmaps = rmaps || [];
        google.script.run.withSuccessHandler(function(progress) {
          progressData = {};
          if (progress && progress.length) {
            progress.forEach(function(p) { progressData[p.stepId] = p.status; });
          } else if (progress && typeof progress === 'object' && !Array.isArray(progress)) {
            progressData = progress;
          }
          renderRoadmaps();
        }).withFailureHandler(function() {
          renderRoadmaps();
        }).getRoadmapProgress(currentUser.userId);
      }).withFailureHandler(function(err) {
        content.innerHTML = '<p class="text-red-500 text-center">ไม่สามารถโหลดข้อมูลได้</p>';
      }).getRoadmaps();
    }

    function getStatusInfo(status) {
      var map = {
        'NOT_STARTED': { label: 'ยังไม่เริ่ม', color: 'bg-gray-200 text-gray-600', dot: 'bg-gray-400', next: 'IN_PROGRESS' },
        'IN_PROGRESS': { label: 'กำลังทำ', color: 'bg-blue-100 text-blue-700', dot: 'bg-blue-500', next: 'COMPLETED' },
        'COMPLETED': { label: 'สำเร็จ', color: 'bg-green-100 text-green-700', dot: 'bg-green-500', next: 'NOT_STARTED' }
      };
      return map[status] || map['NOT_STARTED'];
    }

    function renderRoadmaps() {
      var content = document.getElementById('content');
      if (!roadmaps.length) {
        content.innerHTML = '<div class="text-center py-16"><div class="text-4xl mb-4">🗺️</div><p class="text-gray-500">ยังไม่มี Roadmap</p></div>';
        return;
      }

      var html = '';
      roadmaps.forEach(function(rm, idx) {
        var steps = rm.steps || [];
        var completedCount = 0;
        steps.forEach(function(s) {
          if (progressData[s.stepId] === 'COMPLETED') completedCount++;
        });
        var pct = steps.length ? Math.round((completedCount / steps.length) * 100) : 0;

        html += '<div class="bg-white rounded-xl shadow-sm border border-gray-100 mb-6">' +
          '<div class="p-6 cursor-pointer" onclick="toggleRoadmap(' + idx + ')">' +
          '<div class="flex items-center justify-between">' +
          '<div><h3 class="text-lg font-bold text-gray-800">' + escapeHtml(rm.title || '') + '</h3>' +
          '<p class="text-sm text-gray-500 mt-1">' + escapeHtml(rm.description || '') + '</p>' +
          (rm.category ? '<span class="inline-block mt-2 text-xs bg-blue-50 text-blue-600 px-2 py-0.5 rounded">' + escapeHtml(rm.category) + '</span>' : '') +
          '</div>' +
          '<div class="text-right ml-4"><span class="text-2xl font-bold text-blue-600">' + pct + '%</span>' +
          '<p class="text-xs text-gray-400">' + completedCount + '/' + steps.length + ' ขั้นตอน</p>' +
          '<svg class="w-5 h-5 text-gray-400 mx-auto mt-1 transform transition-transform" id="arrow-' + idx + '" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>' +
          '</div></div>' +
          '<div class="mt-4 w-full bg-gray-200 rounded-full h-2.5"><div class="bg-blue-600 h-2.5 rounded-full transition-all" style="width:' + pct + '%"></div></div>' +
          '</div>' +
          '<div id="roadmap-steps-' + idx + '" class="hidden border-t">' +
          '<div class="p-6">';

        steps.forEach(function(step, si) {
          var status = progressData[step.stepId] || 'NOT_STARTED';
          var info = getStatusInfo(status);
          var isLast = si === steps.length - 1;

          html += '<div class="flex gap-4 ' + (isLast ? '' : 'pb-6') + '">' +
            '<div class="flex flex-col items-center">' +
            '<button onclick="toggleStep(\'' + step.stepId + '\', \'' + info.next + '\', ' + idx + ')" class="w-8 h-8 rounded-full ' + info.dot + ' flex items-center justify-center text-white text-xs font-bold hover:opacity-80 transition flex-shrink-0">' +
            (status === 'COMPLETED' ? '&#10003;' : (si + 1)) +
            '</button>' +
            (isLast ? '' : '<div class="w-0.5 flex-1 ' + (status === 'COMPLETED' ? 'bg-green-300' : 'bg-gray-200') + ' mt-1"></div>') +
            '</div>' +
            '<div class="flex-1 ' + (isLast ? '' : 'pb-2') + '">' +
            '<div class="flex items-center gap-2 mb-1">' +
            '<h4 class="font-semibold text-gray-800">' + escapeHtml(step.title || '') + '</h4>' +
            '<span class="text-xs px-2 py-0.5 rounded-full ' + info.color + '">' + info.label + '</span>' +
            '</div>' +
            '<p class="text-sm text-gray-500">' + escapeHtml(step.description || '') + '</p>' +
            (step.durationDays ? '<p class="text-xs text-gray-400 mt-1">ระยะเวลา: ' + step.durationDays + ' วัน</p>' : '') +
            '</div></div>';
        });

        html += '</div></div></div>';
      });

      content.innerHTML = html;
    }

    function toggleRoadmap(idx) {
      var el = document.getElementById('roadmap-steps-' + idx);
      var arrow = document.getElementById('arrow-' + idx);
      if (el.classList.contains('hidden')) {
        el.classList.remove('hidden');
        arrow.classList.add('rotate-180');
      } else {
        el.classList.add('hidden');
        arrow.classList.remove('rotate-180');
      }
    }

    function toggleStep(stepId, newStatus, rmIdx) {
      google.script.run.withSuccessHandler(function(result) {
        if (result && result.success) {
          progressData[stepId] = newStatus;
          renderRoadmaps();
          var el = document.getElementById('roadmap-steps-' + rmIdx);
          if (el) el.classList.remove('hidden');
          showToast('อัปเดตสถานะสำเร็จ');
        } else {
          showToast('ไม่สามารถอัปเดตได้', true);
        }
      }).withFailureHandler(function(err) {
        showToast('เกิดข้อผิดพลาด', true);
      }).updateRoadmapProgress(currentUser.userId, stepId, newStatus);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    window.onload = initPage;
  </script>
</body>
</html>
