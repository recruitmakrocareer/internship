<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการนักศึกษา - ระบบจัดการนักศึกษาฝึกงาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spinner { border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s; }
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    .modal-overlay { background: rgba(0,0,0,0.5); }
  </style>
</head>
<body class="bg-gray-50">

  <div id="toast" class="hidden fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg toast"></div>

  <!-- Sidebar -->
  <div id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white shadow-lg z-30">
    <div class="p-6 border-b">
      <h1 class="text-lg font-bold text-blue-700">ระบบจัดการฝึกงาน</h1>
    </div>
    <nav class="p-4" id="nav-menu"></nav>
  </div>

  <!-- Main -->
  <div class="ml-64">
    <div class="bg-white shadow-sm px-6 py-3 flex justify-between items-center sticky top-0 z-20">
      <h2 class="text-lg font-semibold" id="page-title">จัดการนักศึกษา</h2>
      <div class="flex items-center gap-4">
        <span id="user-name" class="text-sm text-gray-600"></span>
        <span id="user-role" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full"></span>
        <button onclick="logout()" class="text-sm text-red-600 hover:text-red-800">ออกจากระบบ</button>
      </div>
    </div>

    <div class="p-6" id="content">
      <div class="flex items-center justify-center h-64"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- Add Student Modal -->
  <div id="add-modal" class="hidden fixed inset-0 z-40 flex items-center justify-center modal-overlay">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg p-6 m-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-gray-800">เพิ่มนักศึกษา</h3>
        <button onclick="closeModal('add-modal')" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
      </div>
      <form id="add-form" onsubmit="addStudent(event)">
        <div class="space-y-3">
          <div><label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล</label><input type="text" id="add-name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"></div>
          <div><label class="block text-sm font-medium text-gray-700 mb-1">อีเมล</label><input type="email" id="add-email" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"></div>
          <div><label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label><input type="password" id="add-password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"></div>
          <div><label class="block text-sm font-medium text-gray-700 mb-1">รหัสนักศึกษา</label><input type="text" id="add-student-id" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"></div>
          <div><label class="block text-sm font-medium text-gray-700 mb-1">มหาวิทยาลัย</label><input type="text" id="add-university" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"></div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="block text-sm font-medium text-gray-700 mb-1">คณะ</label><input type="text" id="add-faculty" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-1">สาขา</label><input type="text" id="add-major" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"></div>
          </div>
          <div><label class="block text-sm font-medium text-gray-700 mb-1">ชั้นปี</label>
            <select id="add-year" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
              <option value="1">ปี 1</option><option value="2">ปี 2</option><option value="3">ปี 3</option><option value="4" selected>ปี 4</option><option value="5">ปี 5</option>
            </select>
          </div>
        </div>
        <button type="submit" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition text-sm">เพิ่มนักศึกษา</button>
      </form>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detail-modal" class="hidden fixed inset-0 z-40 flex items-center justify-center modal-overlay">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg p-6 m-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-gray-800">ข้อมูลนักศึกษา</h3>
        <button onclick="closeModal('detail-modal')" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
      </div>
      <div id="detail-content"></div>
    </div>
  </div>

  <!-- Assign Mentor Modal -->
  <div id="mentor-modal" class="hidden fixed inset-0 z-40 flex items-center justify-center modal-overlay">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 m-4">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-gray-800">มอบหมายพี่เลี้ยง</h3>
        <button onclick="closeModal('mentor-modal')" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
      </div>
      <input type="hidden" id="assign-student-id">
      <p class="text-sm text-gray-600 mb-3" id="assign-student-name"></p>
      <select id="mentor-select" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm mb-4">
        <option value="">เลือกพี่เลี้ยง</option>
      </select>
      <button onclick="assignMentor()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition text-sm">มอบหมาย</button>
    </div>
  </div>

  <script>
    var currentUser = null;
    var scriptUrl = '';
    var students = [];
    var mentors = [];

    function initPage() {
      google.script.run.withSuccessHandler(function(url) { scriptUrl = url; }).getScriptUrl();
      google.script.run.withSuccessHandler(function(user) {
        if (!user) { navigateTo('login'); return; }
        currentUser = user;
        document.getElementById('user-name').textContent = user.name;
        document.getElementById('user-role').textContent = getRoleLabel(user.role);
        buildNavMenu(user.role);
        loadPageData();
      }).withFailureHandler(function() { navigateTo('login'); }).getCurrentUser();
    }

    function navigateTo(page) {
      google.script.run.withSuccessHandler(function(url) { window.top.location.href = url + '?page=' + page; }).getScriptUrl();
    }
    function logout() { google.script.run.withSuccessHandler(function() { navigateTo('login'); }).logout(); }
    function getRoleLabel(role) { return { STUDENT: 'นักศึกษา', MENTOR: 'พี่เลี้ยง', ADMIN: 'ผู้ดูแลระบบ' }[role] || role; }

    function buildNavMenu(role) {
      var menus = {
        ADMIN: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'จัดการนักศึกษา', page: 'admin-students', icon: '👨‍🎓' },
          { label: 'จัดการพี่เลี้ยง', page: 'admin-mentors', icon: '👨‍🏫' },
          { label: 'จัดการ Roadmap', page: 'admin-roadmaps', icon: '🗺️' },
          { label: 'จัดการงาน', page: 'admin-assignments', icon: '📝' },
          { label: 'ผลประเมิน', page: 'admin-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'admin-resources', icon: '📚' },
          { label: 'แจ้งเตือน', page: 'admin-notifications', icon: '🔔' }
        ],
        STUDENT: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'โปรไฟล์', page: 'student-profile', icon: '👤' },
          { label: 'Roadmap', page: 'student-roadmap', icon: '🗺️' },
          { label: 'งานที่ได้รับ', page: 'student-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'student-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'student-resources', icon: '📚' }
        ],
        MENTOR: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'นักศึกษาในดูแล', page: 'mentor-students', icon: '👨‍🎓' },
          { label: 'ตรวจงาน', page: 'mentor-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'mentor-evaluations', icon: '⭐' }
        ]
      };
      var items = menus[role] || [];
      var nav = document.getElementById('nav-menu');
      nav.innerHTML = items.map(function(item) {
        var active = item.page === 'admin-students' ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-gray-600 hover:bg-gray-50';
        return '<a href="#" onclick="navigateTo(\'' + item.page + '\')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg mb-1 text-sm ' + active + '">' +
          '<span>' + item.icon + '</span><span>' + item.label + '</span></a>';
      }).join('');
    }

    function showToast(msg, isError) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg toast ' + (isError ? 'bg-red-500 text-white' : 'bg-green-500 text-white');
      setTimeout(function() { toast.className = 'hidden'; }, 3000);
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function loadPageData() {
      google.script.run.withSuccessHandler(function(list) {
        students = list || [];
        renderStudents();
      }).withFailureHandler(function() {
        document.getElementById('content').innerHTML = '<p class="text-red-500 text-center">ไม่สามารถโหลดข้อมูลได้</p>';
      }).getUsers({ role: 'STUDENT' });

      google.script.run.withSuccessHandler(function(list) {
        mentors = list || [];
        var select = document.getElementById('mentor-select');
        select.innerHTML = '<option value="">เลือกพี่เลี้ยง</option>';
        mentors.forEach(function(m) {
          select.innerHTML += '<option value="' + m.userId + '">' + escapeHtml(m.name) + '</option>';
        });
      }).getUsers({ role: 'MENTOR' });
    }

    function renderStudents(query) {
      var filtered = students;
      if (query) {
        var q = query.toLowerCase();
        filtered = students.filter(function(s) {
          return (s.name && s.name.toLowerCase().indexOf(q) !== -1) ||
                 (s.studentId && s.studentId.toLowerCase().indexOf(q) !== -1) ||
                 (s.university && s.university.toLowerCase().indexOf(q) !== -1);
        });
      }

      var html = '<div class="flex justify-between items-center mb-6">' +
        '<div class="relative w-64">' +
        '<input type="text" oninput="renderStudents(this.value)" placeholder="ค้นหานักศึกษา..." class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">' +
        '<svg class="w-4 h-4 text-gray-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></div>' +
        '<button onclick="openModal(\'add-modal\')" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg text-sm transition">+ เพิ่มนักศึกษา</button>' +
        '</div>';

      html += '<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">' +
        '<div class="overflow-x-auto"><table class="w-full">' +
        '<thead><tr class="bg-gray-50 text-left text-sm text-gray-500">' +
        '<th class="px-6 py-3 font-medium">ชื่อ</th>' +
        '<th class="px-6 py-3 font-medium">รหัสนักศึกษา</th>' +
        '<th class="px-6 py-3 font-medium">มหาวิทยาลัย</th>' +
        '<th class="px-6 py-3 font-medium">สาขา</th>' +
        '<th class="px-6 py-3 font-medium">สถานะ</th>' +
        '<th class="px-6 py-3 font-medium">การดำเนินการ</th>' +
        '</tr></thead><tbody>';

      if (!filtered.length) {
        html += '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-400">ไม่พบข้อมูลนักศึกษา</td></tr>';
      } else {
        filtered.forEach(function(s) {
          var statusCls = s.active !== false ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
          var statusLabel = s.active !== false ? 'ใช้งาน' : 'ปิดใช้งาน';
          html += '<tr class="border-t border-gray-100 hover:bg-gray-50">' +
            '<td class="px-6 py-3 text-sm font-medium text-gray-800">' + escapeHtml(s.name || '') + '</td>' +
            '<td class="px-6 py-3 text-sm text-gray-600">' + escapeHtml(s.studentId || '') + '</td>' +
            '<td class="px-6 py-3 text-sm text-gray-600">' + escapeHtml(s.university || '') + '</td>' +
            '<td class="px-6 py-3 text-sm text-gray-600">' + escapeHtml(s.major || '') + '</td>' +
            '<td class="px-6 py-3"><span class="text-xs px-2 py-1 rounded-full ' + statusCls + '">' + statusLabel + '</span></td>' +
            '<td class="px-6 py-3">' +
            '<div class="flex gap-2">' +
            '<button onclick="viewStudent(\'' + s.userId + '\')" class="text-blue-600 hover:text-blue-800 text-sm">ดูข้อมูล</button>' +
            '<button onclick="toggleActive(\'' + s.userId + '\', ' + (s.active !== false) + ')" class="text-sm ' + (s.active !== false ? 'text-red-600 hover:text-red-800' : 'text-green-600 hover:text-green-800') + '">' + (s.active !== false ? 'ปิดใช้งาน' : 'เปิดใช้งาน') + '</button>' +
            '<button onclick="openMentorModal(\'' + s.userId + '\', \'' + escapeHtml(s.name || '') + '\')" class="text-purple-600 hover:text-purple-800 text-sm">มอบหมายพี่เลี้ยง</button>' +
            '</div></td></tr>';
        });
      }

      html += '</tbody></table></div></div>';
      document.getElementById('content').innerHTML = html;
    }

    function viewStudent(userId) {
      var s = students.find(function(st) { return st.userId === userId; });
      if (!s) return;
      var html = '<div class="space-y-3">';
      var fields = [
        ['ชื่อ-นามสกุล', s.name], ['อีเมล', s.email], ['รหัสนักศึกษา', s.studentId],
        ['มหาวิทยาลัย', s.university], ['คณะ', s.faculty], ['สาขา', s.major],
        ['ชั้นปี', s.year ? 'ปี ' + s.year : ''], ['บริษัทฝึกงาน', s.company], ['แผนก', s.department]
      ];
      fields.forEach(function(f) {
        html += '<div class="flex"><span class="text-sm font-medium text-gray-500 w-32">' + f[0] + '</span><span class="text-sm text-gray-800">' + escapeHtml(f[1] || '-') + '</span></div>';
      });
      html += '</div>';
      document.getElementById('detail-content').innerHTML = html;
      openModal('detail-modal');
    }

    function toggleActive(userId, currentActive) {
      google.script.run.withSuccessHandler(function(result) {
        if (result && result.success) {
          showToast('อัปเดตสถานะสำเร็จ');
          loadPageData();
        } else { showToast('ไม่สามารถอัปเดตได้', true); }
      }).withFailureHandler(function(err) {
        showToast('เกิดข้อผิดพลาด', true);
      }).updateProfile(userId, { active: !currentActive });
    }

    function openMentorModal(userId, name) {
      document.getElementById('assign-student-id').value = userId;
      document.getElementById('assign-student-name').textContent = 'นักศึกษา: ' + name;
      openModal('mentor-modal');
    }

    function assignMentor() {
      var studentId = document.getElementById('assign-student-id').value;
      var mentorId = document.getElementById('mentor-select').value;
      if (!mentorId) { showToast('กรุณาเลือกพี่เลี้ยง', true); return; }

      google.script.run.withSuccessHandler(function(result) {
        if (result && result.success) {
          showToast('มอบหมายพี่เลี้ยงสำเร็จ');
          closeModal('mentor-modal');
        } else { showToast('ไม่สามารถมอบหมายได้', true); }
      }).withFailureHandler(function(err) {
        showToast('เกิดข้อผิดพลาด', true);
      }).updateProfile(studentId, { mentorId: mentorId });
    }

    function addStudent(e) {
      e.preventDefault();
      var data = {
        name: document.getElementById('add-name').value.trim(),
        email: document.getElementById('add-email').value.trim(),
        password: document.getElementById('add-password').value,
        studentId: document.getElementById('add-student-id').value.trim(),
        university: document.getElementById('add-university').value.trim(),
        faculty: document.getElementById('add-faculty').value.trim(),
        major: document.getElementById('add-major').value.trim(),
        year: document.getElementById('add-year').value
      };

      google.script.run.withSuccessHandler(function(result) {
        if (result && result.success) {
          showToast('เพิ่มนักศึกษาสำเร็จ');
          closeModal('add-modal');
          document.getElementById('add-form').reset();
          loadPageData();
        } else { showToast(result && result.message ? result.message : 'ไม่สามารถเพิ่มได้', true); }
      }).withFailureHandler(function(err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message, true);
      }).register(data);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    window.onload = initPage;
  </script>
</body>
</html>
