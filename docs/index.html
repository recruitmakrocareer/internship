<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการนักศึกษาฝึกงาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a'
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Thai', sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app"></div>
  <div id="toast-container" class="fixed top-4 right-4 z-[60] space-y-2"></div>
  <div id="loading-overlay" class="hidden fixed inset-0 bg-black bg-opacity-30 z-[55] flex items-center justify-center">
    <div class="bg-white p-6 rounded-xl shadow-lg flex items-center gap-3">
      <svg class="animate-spin h-5 w-5 text-primary-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <span class="text-gray-600 font-medium">กำลังโหลด...</span>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

  <script src="js/pages/admin-assignments.js"></script>
  <script src="js/pages/admin-evaluations.js"></script>
  <script src="js/pages/admin-resources.js"></script>
  <script src="js/pages/admin-notifications.js"></script>
  <script src="js/pages/mentor-students.js"></script>
  <script src="js/pages/mentor-assignments.js"></script>
  <script src="js/pages/mentor-evaluations.js"></script>
  <script src="js/router.js"></script>

</html>
