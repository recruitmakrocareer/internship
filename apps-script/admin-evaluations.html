<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ผลประเมิน - ระบบจัดการนักศึกษาฝึกงาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spinner { border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50">

  <!-- Sidebar -->
  <div id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white shadow-lg z-30">
    <div class="p-6 border-b"><h1 class="text-lg font-bold text-blue-700">ระบบจัดการฝึกงาน</h1></div>
    <nav class="p-4" id="nav-menu"></nav>
  </div>

  <!-- Main -->
  <div class="ml-64">
    <div class="bg-white shadow-sm px-6 py-3 flex justify-between items-center sticky top-0 z-20">
      <h2 class="text-lg font-semibold" id="page-title">ผลประเมิน</h2>
      <div class="flex items-center gap-4">
        <span id="user-name" class="text-sm text-gray-600"></span>
        <span id="user-role" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full"></span>
        <button onclick="logout()" class="text-sm text-red-600 hover:text-red-800">ออกจากระบบ</button>
      </div>
    </div>
    <div class="p-6" id="content">
      <div class="flex items-center justify-center h-64"><div class="spinner"></div></div>
    </div>
  </div>

  <script>
    var currentUser = null;
    var scriptUrl = '';
    var allEvals = [];
    var filterType = 'all';

    function initPage() {
      google.script.run.withSuccessHandler(function(url) { scriptUrl = url; }).getScriptUrl();
      google.script.run.withSuccessHandler(function(user) {
        if (!user) { navigateTo('login'); return; }
        currentUser = user;
        document.getElementById('user-name').textContent = user.name;
        document.getElementById('user-role').textContent = getRoleLabel(user.role);
        buildNavMenu(user.role);
        loadPageData();
      }).withFailureHandler(function() { navigateTo('login'); }).getCurrentUser();
    }

    function navigateTo(page) { google.script.run.withSuccessHandler(function(url) { window.top.location.href = url + '?page=' + page; }).getScriptUrl(); }
    function logout() { google.script.run.withSuccessHandler(function() { navigateTo('login'); }).logout(); }
    function getRoleLabel(role) { return { STUDENT: 'นักศึกษา', MENTOR: 'พี่เลี้ยง', ADMIN: 'ผู้ดูแลระบบ' }[role] || role; }

    function buildNavMenu(role) {
      var menus = {
        ADMIN: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'จัดการนักศึกษา', page: 'admin-students', icon: '👨‍🎓' },
          { label: 'จัดการพี่เลี้ยง', page: 'admin-mentors', icon: '👨‍🏫' },
          { label: 'จัดการ Roadmap', page: 'admin-roadmaps', icon: '🗺️' },
          { label: 'จัดการงาน', page: 'admin-assignments', icon: '📝' },
          { label: 'ผลประเมิน', page: 'admin-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'admin-resources', icon: '📚' },
          { label: 'แจ้งเตือน', page: 'admin-notifications', icon: '🔔' }
        ],
        STUDENT: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'โปรไฟล์', page: 'student-profile', icon: '👤' },
          { label: 'Roadmap', page: 'student-roadmap', icon: '🗺️' },
          { label: 'งานที่ได้รับ', page: 'student-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'student-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'student-resources', icon: '📚' }
        ],
        MENTOR: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'นักศึกษาในดูแล', page: 'mentor-students', icon: '👨‍🎓' },
          { label: 'ตรวจงาน', page: 'mentor-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'mentor-evaluations', icon: '⭐' }
        ]
      };
      var items = menus[role] || [];
      var nav = document.getElementById('nav-menu');
      nav.innerHTML = items.map(function(item) {
        var active = item.page === 'admin-evaluations' ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-gray-600 hover:bg-gray-50';
        return '<a href="#" onclick="navigateTo(\'' + item.page + '\')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg mb-1 text-sm ' + active + '">' +
          '<span>' + item.icon + '</span><span>' + item.label + '</span></a>';
      }).join('');
    }

    function loadPageData() {
      google.script.run.withSuccessHandler(function(evals) {
        allEvals = evals || [];
        renderEvaluations();
      }).withFailureHandler(function() {
        document.getElementById('content').innerHTML = '<p class="text-red-500 text-center">ไม่สามารถโหลดข้อมูลได้</p>';
      }).getEvaluations({});
    }

    function renderEvaluations() {
      var filtered = allEvals;
      if (filterType !== 'all') {
        filtered = allEvals.filter(function(e) { return e.type === filterType; });
      }

      var typeLabels = { 'mentor_to_student': 'พี่เลี้ยง -> นักศึกษา', 'student_to_mentor': 'นักศึกษา -> พี่เลี้ยง' };

      var html = '<div class="flex items-center gap-4 mb-6">' +
        '<h3 class="text-lg font-bold text-gray-800">ผลประเมินทั้งหมด</h3>' +
        '<div class="flex gap-2">' +
        '<button onclick="setFilter(\'all\')" class="px-3 py-1.5 rounded-lg text-sm ' + (filterType === 'all' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border border-gray-300') + '">ทั้งหมด</button>' +
        '<button onclick="setFilter(\'mentor_to_student\')" class="px-3 py-1.5 rounded-lg text-sm ' + (filterType === 'mentor_to_student' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border border-gray-300') + '">พี่เลี้ยง -> นักศึกษา</button>' +
        '<button onclick="setFilter(\'student_to_mentor\')" class="px-3 py-1.5 rounded-lg text-sm ' + (filterType === 'student_to_mentor' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border border-gray-300') + '">นักศึกษา -> พี่เลี้ยง</button>' +
        '</div></div>';

      html += '<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden"><div class="overflow-x-auto"><table class="w-full">' +
        '<thead><tr class="bg-gray-50 text-left text-sm text-gray-500">' +
        '<th class="px-6 py-3 font-medium">ประเภท</th>' +
        '<th class="px-6 py-3 font-medium">ผู้ประเมิน</th>' +
        '<th class="px-6 py-3 font-medium">ผู้ถูกประเมิน</th>' +
        '<th class="px-6 py-3 font-medium">คะแนนเฉลี่ย</th>' +
        '<th class="px-6 py-3 font-medium">วันที่</th>' +
        '</tr></thead><tbody>';

      if (!filtered.length) {
        html += '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-400">ไม่พบข้อมูลการประเมิน</td></tr>';
      } else {
        filtered.forEach(function(ev) {
          var avgScore = 0;
          if (ev.scores) {
            var vals = Object.values(ev.scores);
            if (vals.length) avgScore = (vals.reduce(function(a, b) { return a + b; }, 0) / vals.length).toFixed(1);
          }
          var typeBadge = ev.type === 'mentor_to_student' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700';
          html += '<tr class="border-t border-gray-100 hover:bg-gray-50">' +
            '<td class="px-6 py-3"><span class="text-xs px-2 py-1 rounded-full ' + typeBadge + '">' + (typeLabels[ev.type] || ev.type) + '</span></td>' +
            '<td class="px-6 py-3 text-sm text-gray-800">' + escapeHtml(ev.evaluatorName || ev.evaluatorId || '-') + '</td>' +
            '<td class="px-6 py-3 text-sm text-gray-800">' + escapeHtml(ev.evaluateeName || ev.evaluateeId || '-') + '</td>' +
            '<td class="px-6 py-3 text-sm font-semibold text-gray-800">' + avgScore + '/5</td>' +
            '<td class="px-6 py-3 text-sm text-gray-500">' + (ev.createdAt || '-') + '</td>' +
            '</tr>';
        });
      }

      html += '</tbody></table></div></div>';
      document.getElementById('content').innerHTML = html;
    }

    function setFilter(type) {
      filterType = type;
      renderEvaluations();
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    window.onload = initPage;
  </script>
</body>
</html>
