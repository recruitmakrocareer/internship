<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แหล่งความรู้ - ระบบจัดการนักศึกษาฝึกงาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spinner { border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50">

  <!-- Sidebar -->
  <div id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white shadow-lg z-30">
    <div class="p-6 border-b">
      <h1 class="text-lg font-bold text-blue-700">ระบบจัดการฝึกงาน</h1>
    </div>
    <nav class="p-4" id="nav-menu"></nav>
  </div>

  <!-- Main -->
  <div class="ml-64">
    <div class="bg-white shadow-sm px-6 py-3 flex justify-between items-center sticky top-0 z-20">
      <h2 class="text-lg font-semibold" id="page-title">แหล่งความรู้</h2>
      <div class="flex items-center gap-4">
        <span id="user-name" class="text-sm text-gray-600"></span>
        <span id="user-role" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full"></span>
        <button onclick="logout()" class="text-sm text-red-600 hover:text-red-800">ออกจากระบบ</button>
      </div>
    </div>

    <div class="p-6" id="content">
      <div class="flex items-center justify-center h-64"><div class="spinner"></div></div>
    </div>
  </div>

  <script>
    var currentUser = null;
    var scriptUrl = '';
    var allResources = [];
    var currentFilter = 'ทั้งหมด';
    var searchQuery = '';

    function initPage() {
      google.script.run.withSuccessHandler(function(url) { scriptUrl = url; }).getScriptUrl();
      google.script.run.withSuccessHandler(function(user) {
        if (!user) { navigateTo('login'); return; }
        currentUser = user;
        document.getElementById('user-name').textContent = user.name;
        document.getElementById('user-role').textContent = getRoleLabel(user.role);
        buildNavMenu(user.role);
        loadPageData();
      }).withFailureHandler(function() { navigateTo('login'); }).getCurrentUser();
    }

    function navigateTo(page) {
      google.script.run.withSuccessHandler(function(url) {
        window.top.location.href = url + '?page=' + page;
      }).getScriptUrl();
    }

    function logout() {
      google.script.run.withSuccessHandler(function() { navigateTo('login'); }).logout();
    }

    function getRoleLabel(role) {
      return { STUDENT: 'นักศึกษา', MENTOR: 'พี่เลี้ยง', ADMIN: 'ผู้ดูแลระบบ' }[role] || role;
    }

    function buildNavMenu(role) {
      var menus = {
        ADMIN: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'จัดการนักศึกษา', page: 'admin-students', icon: '👨‍🎓' },
          { label: 'จัดการพี่เลี้ยง', page: 'admin-mentors', icon: '👨‍🏫' },
          { label: 'จัดการ Roadmap', page: 'admin-roadmaps', icon: '🗺️' },
          { label: 'จัดการงาน', page: 'admin-assignments', icon: '📝' },
          { label: 'ผลประเมิน', page: 'admin-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'admin-resources', icon: '📚' },
          { label: 'แจ้งเตือน', page: 'admin-notifications', icon: '🔔' }
        ],
        STUDENT: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'โปรไฟล์', page: 'student-profile', icon: '👤' },
          { label: 'Roadmap', page: 'student-roadmap', icon: '🗺️' },
          { label: 'งานที่ได้รับ', page: 'student-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'student-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'student-resources', icon: '📚' }
        ],
        MENTOR: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'นักศึกษาในดูแล', page: 'mentor-students', icon: '👨‍🎓' },
          { label: 'ตรวจงาน', page: 'mentor-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'mentor-evaluations', icon: '⭐' }
        ]
      };
      var items = menus[role] || [];
      var nav = document.getElementById('nav-menu');
      nav.innerHTML = items.map(function(item) {
        var active = item.page === 'student-resources' ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-gray-600 hover:bg-gray-50';
        return '<a href="#" onclick="navigateTo(\'' + item.page + '\')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg mb-1 text-sm ' + active + '">' +
          '<span>' + item.icon + '</span><span>' + item.label + '</span></a>';
      }).join('');
    }

    function getTypeIcon(type) {
      var icons = { 'document': '📄', 'lesson': '📖', 'video': '🎬', 'link': '🔗' };
      return icons[type] || '📄';
    }

    function getCategoryBadge(cat) {
      var colors = { 'เอกสาร': 'bg-blue-100 text-blue-700', 'บทเรียน': 'bg-green-100 text-green-700', 'วิดีโอ': 'bg-red-100 text-red-700', 'ลิงก์': 'bg-purple-100 text-purple-700' };
      return '<span class="text-xs px-2 py-0.5 rounded-full ' + (colors[cat] || 'bg-gray-100 text-gray-700') + '">' + escapeHtml(cat || '') + '</span>';
    }

    function loadPageData() {
      google.script.run.withSuccessHandler(function(resources) {
        allResources = resources || [];
        renderResources();
      }).withFailureHandler(function() {
        document.getElementById('content').innerHTML = '<p class="text-red-500 text-center">ไม่สามารถโหลดข้อมูลได้</p>';
      }).getResources();
    }

    function renderResources() {
      var categories = ['ทั้งหมด', 'เอกสาร', 'บทเรียน', 'วิดีโอ', 'ลิงก์'];
      var filtered = allResources.filter(function(r) {
        var matchCat = currentFilter === 'ทั้งหมด' || r.category === currentFilter;
        var matchSearch = !searchQuery || (r.title && r.title.toLowerCase().indexOf(searchQuery.toLowerCase()) !== -1) || (r.description && r.description.toLowerCase().indexOf(searchQuery.toLowerCase()) !== -1);
        return matchCat && matchSearch;
      });

      var html = '<div class="mb-6">' +
        '<div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between">' +
        '<div class="flex gap-2 flex-wrap">';

      categories.forEach(function(cat) {
        var active = cat === currentFilter ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border border-gray-300 hover:bg-gray-50';
        html += '<button onclick="filterCategory(\'' + cat + '\')" class="px-4 py-2 rounded-lg text-sm font-medium transition ' + active + '">' + cat + '</button>';
      });

      html += '</div>' +
        '<div class="relative w-full sm:w-64">' +
        '<input type="text" id="search-input" value="' + escapeHtml(searchQuery) + '" oninput="handleSearch(this.value)" placeholder="ค้นหาแหล่งความรู้..." class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm">' +
        '<svg class="w-4 h-4 text-gray-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>' +
        '</div></div></div>';

      if (!filtered.length) {
        html += '<div class="text-center py-16"><div class="text-4xl mb-4">📚</div><p class="text-gray-500">ไม่พบแหล่งความรู้</p></div>';
      } else {
        html += '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">';
        filtered.forEach(function(r) {
          html += '<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 hover:shadow-md transition cursor-pointer" onclick="openResource(\'' + escapeHtml(r.url || '') + '\')">' +
            '<div class="flex items-start gap-3">' +
            '<div class="w-10 h-10 bg-blue-50 rounded-lg flex items-center justify-center text-lg flex-shrink-0">' + getTypeIcon(r.type) + '</div>' +
            '<div class="flex-1 min-w-0">' +
            '<h4 class="font-semibold text-gray-800 mb-1 truncate">' + escapeHtml(r.title || '') + '</h4>' +
            '<p class="text-sm text-gray-500 line-clamp-2 mb-2">' + escapeHtml(r.description || '') + '</p>' +
            getCategoryBadge(r.category) +
            '</div></div></div>';
        });
        html += '</div>';
      }

      document.getElementById('content').innerHTML = html;
    }

    function filterCategory(cat) {
      currentFilter = cat;
      renderResources();
    }

    function handleSearch(val) {
      searchQuery = val;
      renderResources();
    }

    function openResource(url) {
      if (url) window.open(url, '_blank');
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    window.onload = initPage;
  </script>
</body>
</html>
