<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>งานที่ได้รับ - ระบบจัดการนักศึกษาฝึกงาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spinner { border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s; }
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  </style>
</head>
<body class="bg-gray-50">

  <div id="toast" class="hidden fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg toast"></div>

  <!-- Sidebar -->
  <div id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white shadow-lg z-30">
    <div class="p-6 border-b">
      <h1 class="text-lg font-bold text-blue-700">ระบบจัดการฝึกงาน</h1>
    </div>
    <nav class="p-4" id="nav-menu"></nav>
  </div>

  <!-- Main -->
  <div class="ml-64">
    <div class="bg-white shadow-sm px-6 py-3 flex justify-between items-center sticky top-0 z-20">
      <h2 class="text-lg font-semibold" id="page-title">งานที่ได้รับ</h2>
      <div class="flex items-center gap-4">
        <span id="user-name" class="text-sm text-gray-600"></span>
        <span id="user-role" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full"></span>
        <button onclick="logout()" class="text-sm text-red-600 hover:text-red-800">ออกจากระบบ</button>
      </div>
    </div>

    <div class="p-6" id="content">
      <div class="flex items-center justify-center h-64"><div class="spinner"></div></div>
    </div>
  </div>

  <script>
    var currentUser = null;
    var scriptUrl = '';
    var assignments = [];
    var submissions = {};

    function initPage() {
      google.script.run.withSuccessHandler(function(url) { scriptUrl = url; }).getScriptUrl();
      google.script.run.withSuccessHandler(function(user) {
        if (!user) { navigateTo('login'); return; }
        currentUser = user;
        document.getElementById('user-name').textContent = user.name;
        document.getElementById('user-role').textContent = getRoleLabel(user.role);
        buildNavMenu(user.role);
        loadPageData();
      }).withFailureHandler(function() { navigateTo('login'); }).getCurrentUser();
    }

    function navigateTo(page) {
      google.script.run.withSuccessHandler(function(url) {
        window.top.location.href = url + '?page=' + page;
      }).getScriptUrl();
    }

    function logout() {
      google.script.run.withSuccessHandler(function() { navigateTo('login'); }).logout();
    }

    function getRoleLabel(role) {
      return { STUDENT: 'นักศึกษา', MENTOR: 'พี่เลี้ยง', ADMIN: 'ผู้ดูแลระบบ' }[role] || role;
    }

    function buildNavMenu(role) {
      var menus = {
        ADMIN: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'จัดการนักศึกษา', page: 'admin-students', icon: '👨‍🎓' },
          { label: 'จัดการพี่เลี้ยง', page: 'admin-mentors', icon: '👨‍🏫' },
          { label: 'จัดการ Roadmap', page: 'admin-roadmaps', icon: '🗺️' },
          { label: 'จัดการงาน', page: 'admin-assignments', icon: '📝' },
          { label: 'ผลประเมิน', page: 'admin-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'admin-resources', icon: '📚' },
          { label: 'แจ้งเตือน', page: 'admin-notifications', icon: '🔔' }
        ],
        STUDENT: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'โปรไฟล์', page: 'student-profile', icon: '👤' },
          { label: 'Roadmap', page: 'student-roadmap', icon: '🗺️' },
          { label: 'งานที่ได้รับ', page: 'student-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'student-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'student-resources', icon: '📚' }
        ],
        MENTOR: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'นักศึกษาในดูแล', page: 'mentor-students', icon: '👨‍🎓' },
          { label: 'ตรวจงาน', page: 'mentor-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'mentor-evaluations', icon: '⭐' }
        ]
      };
      var items = menus[role] || [];
      var nav = document.getElementById('nav-menu');
      nav.innerHTML = items.map(function(item) {
        var active = item.page === 'student-assignments' ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-gray-600 hover:bg-gray-50';
        return '<a href="#" onclick="navigateTo(\'' + item.page + '\')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg mb-1 text-sm ' + active + '">' +
          '<span>' + item.icon + '</span><span>' + item.label + '</span></a>';
      }).join('');
    }

    function showToast(msg, isError) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg toast ' + (isError ? 'bg-red-500 text-white' : 'bg-green-500 text-white');
      setTimeout(function() { toast.className = 'hidden'; }, 3000);
    }

    function getStatusBadge(status) {
      var map = {
        'PENDING': { label: 'รอส่งงาน', cls: 'bg-yellow-100 text-yellow-800' },
        'SUBMITTED': { label: 'ส่งแล้ว', cls: 'bg-blue-100 text-blue-800' },
        'REVIEWED': { label: 'ตรวจแล้ว', cls: 'bg-purple-100 text-purple-800' },
        'APPROVED': { label: 'อนุมัติ', cls: 'bg-green-100 text-green-800' },
        'REVISION_REQUESTED': { label: 'ขอแก้ไข', cls: 'bg-orange-100 text-orange-800' }
      };
      var info = map[status] || map['PENDING'];
      return '<span class="text-xs px-2 py-1 rounded-full ' + info.cls + '">' + info.label + '</span>';
    }

    function loadPageData() {
      google.script.run.withSuccessHandler(function(aList) {
        assignments = aList || [];
        google.script.run.withSuccessHandler(function(sList) {
          submissions = {};
          if (sList && sList.length) {
            sList.forEach(function(s) { submissions[s.assignmentId] = s; });
          }
          renderAssignments();
        }).withFailureHandler(function() {
          renderAssignments();
        }).getSubmissions({ userId: currentUser.userId });
      }).withFailureHandler(function() {
        document.getElementById('content').innerHTML = '<p class="text-red-500 text-center">ไม่สามารถโหลดข้อมูลได้</p>';
      }).getAssignments();
    }

    function renderAssignments() {
      var content = document.getElementById('content');
      if (!assignments.length) {
        content.innerHTML = '<div class="text-center py-16"><div class="text-4xl mb-4">📝</div><p class="text-gray-500">ยังไม่มีงานที่ได้รับมอบหมาย</p></div>';
        return;
      }

      var html = '<div class="space-y-4">';
      assignments.forEach(function(a, idx) {
        var sub = submissions[a.assignmentId] || null;
        var status = sub ? sub.status : 'PENDING';

        html += '<div class="bg-white rounded-xl shadow-sm border border-gray-100">' +
          '<div class="p-6 cursor-pointer" onclick="toggleAssignment(' + idx + ')">' +
          '<div class="flex items-center justify-between">' +
          '<div class="flex-1">' +
          '<div class="flex items-center gap-3 mb-2">' +
          '<h3 class="text-lg font-semibold text-gray-800">' + escapeHtml(a.title || '') + '</h3>' +
          getStatusBadge(status) +
          '</div>' +
          '<p class="text-sm text-gray-500">' + escapeHtml(a.description || '') + '</p>' +
          '<div class="flex gap-4 mt-3 text-xs text-gray-400">' +
          '<span>กำหนดส่ง: ' + (a.dueDate || 'ไม่ระบุ') + '</span>' +
          '<span>คะแนนเต็ม: ' + (a.maxScore || 0) + '</span>' +
          '</div></div>' +
          '<svg class="w-5 h-5 text-gray-400 ml-4 transform transition-transform" id="arrow-' + idx + '" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>' +
          '</div></div>' +
          '<div id="assignment-detail-' + idx + '" class="hidden border-t p-6">';

        if (sub && (sub.status === 'REVIEWED' || sub.status === 'APPROVED')) {
          html += '<div class="mb-4 p-4 bg-green-50 rounded-lg">' +
            '<h4 class="font-semibold text-green-800 mb-2">ผลการตรวจ</h4>' +
            '<p class="text-sm">คะแนน: <span class="font-bold text-green-700">' + (sub.score || 0) + '/' + (a.maxScore || 0) + '</span></p>' +
            (sub.feedback ? '<p class="text-sm mt-1">ความคิดเห็น: ' + escapeHtml(sub.feedback) + '</p>' : '') +
            '</div>';
        }

        if (sub && sub.status === 'REVISION_REQUESTED') {
          html += '<div class="mb-4 p-4 bg-orange-50 rounded-lg">' +
            '<h4 class="font-semibold text-orange-800 mb-2">ขอแก้ไข</h4>' +
            (sub.feedback ? '<p class="text-sm text-orange-700">' + escapeHtml(sub.feedback) + '</p>' : '') +
            '</div>';
        }

        if (sub && sub.content) {
          html += '<div class="mb-4 p-4 bg-gray-50 rounded-lg">' +
            '<h4 class="font-semibold text-gray-700 mb-1">งานที่ส่ง</h4>' +
            '<p class="text-sm text-gray-600">' + escapeHtml(sub.content) + '</p>' +
            (sub.fileUrl ? '<a href="' + escapeHtml(sub.fileUrl) + '" target="_blank" class="text-blue-600 text-sm hover:underline mt-1 inline-block">ดูไฟล์แนบ</a>' : '') +
            '</div>';
        }

        if (!sub || sub.status === 'PENDING' || sub.status === 'REVISION_REQUESTED') {
          html += '<div>' +
            '<h4 class="font-semibold text-gray-700 mb-3">ส่งงาน</h4>' +
            '<textarea id="submit-content-' + idx + '" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm" placeholder="เขียนคำตอบหรือรายละเอียดงาน...">' + (sub && sub.content ? escapeHtml(sub.content) : '') + '</textarea>' +
            '<input type="text" id="submit-file-' + idx + '" class="w-full mt-2 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm" placeholder="ลิงก์ Google Drive (ไม่บังคับ)" value="' + (sub && sub.fileUrl ? escapeHtml(sub.fileUrl) : '') + '">' +
            '<button onclick="submitWork(\'' + a.assignmentId + '\', ' + idx + ')" class="mt-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-lg text-sm transition">ส่งงาน</button>' +
            '</div>';
        }

        html += '</div></div>';
      });
      html += '</div>';
      content.innerHTML = html;
    }

    function toggleAssignment(idx) {
      var el = document.getElementById('assignment-detail-' + idx);
      var arrow = document.getElementById('arrow-' + idx);
      if (el.classList.contains('hidden')) {
        el.classList.remove('hidden');
        arrow.classList.add('rotate-180');
      } else {
        el.classList.add('hidden');
        arrow.classList.remove('rotate-180');
      }
    }

    function submitWork(assignmentId, idx) {
      var content = document.getElementById('submit-content-' + idx).value.trim();
      var fileUrl = document.getElementById('submit-file-' + idx).value.trim();

      if (!content && !fileUrl) {
        showToast('กรุณากรอกคำตอบหรือแนบลิงก์', true);
        return;
      }

      var data = {
        assignmentId: assignmentId,
        userId: currentUser.userId,
        content: content,
        fileUrl: fileUrl
      };

      google.script.run.withSuccessHandler(function(result) {
        if (result && result.success) {
          showToast('ส่งงานสำเร็จ');
          loadPageData();
        } else {
          showToast(result && result.message ? result.message : 'ไม่สามารถส่งงานได้', true);
        }
      }).withFailureHandler(function(err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message, true);
      }).submitAssignment(data);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    window.onload = initPage;
  </script>
</body>
</html>
