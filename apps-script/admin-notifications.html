<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แจ้งเตือน - ระบบจัดการนักศึกษาฝึกงาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spinner { border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s; }
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  </style>
</head>
<body class="bg-gray-50">

  <div id="toast" class="hidden fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg toast"></div>

  <!-- Sidebar -->
  <div id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white shadow-lg z-30">
    <div class="p-6 border-b"><h1 class="text-lg font-bold text-blue-700">ระบบจัดการฝึกงาน</h1></div>
    <nav class="p-4" id="nav-menu"></nav>
  </div>

  <!-- Main -->
  <div class="ml-64">
    <div class="bg-white shadow-sm px-6 py-3 flex justify-between items-center sticky top-0 z-20">
      <h2 class="text-lg font-semibold" id="page-title">ศูนย์แจ้งเตือน</h2>
      <div class="flex items-center gap-4">
        <span id="user-name" class="text-sm text-gray-600"></span>
        <span id="user-role" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full"></span>
        <button onclick="logout()" class="text-sm text-red-600 hover:text-red-800">ออกจากระบบ</button>
      </div>
    </div>
    <div class="p-6" id="content">
      <div class="flex items-center justify-center h-64"><div class="spinner"></div></div>
    </div>
  </div>

  <script>
    var currentUser = null;
    var scriptUrl = '';
    var studentsList = [];

    function initPage() {
      google.script.run.withSuccessHandler(function(url) { scriptUrl = url; }).getScriptUrl();
      google.script.run.withSuccessHandler(function(user) {
        if (!user) { navigateTo('login'); return; }
        currentUser = user;
        document.getElementById('user-name').textContent = user.name;
        document.getElementById('user-role').textContent = getRoleLabel(user.role);
        buildNavMenu(user.role);
        loadPageData();
      }).withFailureHandler(function() { navigateTo('login'); }).getCurrentUser();
    }

    function navigateTo(page) { google.script.run.withSuccessHandler(function(url) { window.top.location.href = url + '?page=' + page; }).getScriptUrl(); }
    function logout() { google.script.run.withSuccessHandler(function() { navigateTo('login'); }).logout(); }
    function getRoleLabel(role) { return { STUDENT: 'นักศึกษา', MENTOR: 'พี่เลี้ยง', ADMIN: 'ผู้ดูแลระบบ' }[role] || role; }

    function buildNavMenu(role) {
      var menus = {
        ADMIN: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'จัดการนักศึกษา', page: 'admin-students', icon: '👨‍🎓' },
          { label: 'จัดการพี่เลี้ยง', page: 'admin-mentors', icon: '👨‍🏫' },
          { label: 'จัดการ Roadmap', page: 'admin-roadmaps', icon: '🗺️' },
          { label: 'จัดการงาน', page: 'admin-assignments', icon: '📝' },
          { label: 'ผลประเมิน', page: 'admin-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'admin-resources', icon: '📚' },
          { label: 'แจ้งเตือน', page: 'admin-notifications', icon: '🔔' }
        ],
        STUDENT: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'โปรไฟล์', page: 'student-profile', icon: '👤' },
          { label: 'Roadmap', page: 'student-roadmap', icon: '🗺️' },
          { label: 'งานที่ได้รับ', page: 'student-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'student-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'student-resources', icon: '📚' }
        ],
        MENTOR: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'นักศึกษาในดูแล', page: 'mentor-students', icon: '👨‍🎓' },
          { label: 'ตรวจงาน', page: 'mentor-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'mentor-evaluations', icon: '⭐' }
        ]
      };
      var items = menus[role] || [];
      var nav = document.getElementById('nav-menu');
      nav.innerHTML = items.map(function(item) {
        var active = item.page === 'admin-notifications' ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-gray-600 hover:bg-gray-50';
        return '<a href="#" onclick="navigateTo(\'' + item.page + '\')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg mb-1 text-sm ' + active + '">' +
          '<span>' + item.icon + '</span><span>' + item.label + '</span></a>';
      }).join('');
    }

    function showToast(msg, isError) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg toast ' + (isError ? 'bg-red-500 text-white' : 'bg-green-500 text-white');
      setTimeout(function() { toast.className = 'hidden'; }, 3000);
    }

    function loadPageData() {
      // Load students for recipient dropdown
      google.script.run.withSuccessHandler(function(list) {
        studentsList = list || [];
        renderPage();
      }).withFailureHandler(function() {
        renderPage();
      }).getUsers({ role: 'STUDENT' });
    }

    function renderPage() {
      var html = '<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">';

      // Send notification form
      html += '<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">' +
        '<h3 class="text-lg font-bold text-gray-800 mb-6 flex items-center gap-2">' +
        '<span class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center text-sm">🔔</span>' +
        'ส่งแจ้งเตือน</h3>' +
        '<form id="notif-form" onsubmit="sendNotification(event)">' +
        '<div class="space-y-4">' +
        '<div><label class="block text-sm font-medium text-gray-700 mb-1">หัวข้อ</label>' +
        '<input type="text" id="n-title" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="หัวข้อแจ้งเตือน"></div>' +
        '<div><label class="block text-sm font-medium text-gray-700 mb-1">ข้อความ</label>' +
        '<textarea id="n-message" rows="4" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="รายละเอียดแจ้งเตือน..."></textarea></div>' +
        '<div><label class="block text-sm font-medium text-gray-700 mb-1">ผู้รับ</label>' +
        '<select id="n-recipient" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">' +
        '<option value="all">นักศึกษาทั้งหมด</option>';

      studentsList.forEach(function(s) {
        html += '<option value="' + s.userId + '">' + escapeHtml(s.name) + ' (' + escapeHtml(s.studentId || '') + ')</option>';
      });

      html += '</select></div>' +
        '<div class="flex items-center gap-2">' +
        '<input type="checkbox" id="n-line" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">' +
        '<label for="n-line" class="text-sm text-gray-700">ส่งผ่าน LINE ด้วย</label></div>' +
        '</div>' +
        '<button type="submit" id="send-btn" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition text-sm">ส่งแจ้งเตือน</button>' +
        '</form></div>';

      // History
      html += '<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">' +
        '<h3 class="text-lg font-bold text-gray-800 mb-6 flex items-center gap-2">' +
        '<span class="w-8 h-8 bg-green-100 rounded-lg flex items-center justify-center text-sm">📋</span>' +
        'ประวัติการแจ้งเตือน</h3>' +
        '<div id="notif-history"><div class="flex justify-center py-8"><div class="spinner"></div></div></div>' +
        '</div>';

      html += '</div>';
      document.getElementById('content').innerHTML = html;

      // Load history
      google.script.run.withSuccessHandler(function(notifications) {
        var el = document.getElementById('notif-history');
        if (!notifications || !notifications.length) {
          el.innerHTML = '<p class="text-gray-400 text-center py-4">ยังไม่มีประวัติ</p>';
          return;
        }
        var h = '<div class="space-y-3 max-h-96 overflow-y-auto">';
        notifications.forEach(function(n) {
          h += '<div class="border border-gray-100 rounded-lg p-4">' +
            '<div class="flex justify-between items-start mb-1">' +
            '<h4 class="text-sm font-semibold text-gray-800">' + escapeHtml(n.title || '') + '</h4>' +
            '<span class="text-xs text-gray-400 whitespace-nowrap ml-2">' + (n.createdAt || '') + '</span></div>' +
            '<p class="text-sm text-gray-600">' + escapeHtml(n.message || '') + '</p>' +
            '<div class="flex gap-2 mt-2">' +
            '<span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded">ผู้รับ: ' + (n.recipientName || n.recipientId || 'ทั้งหมด') + '</span>' +
            (n.sendLine ? '<span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">LINE</span>' : '') +
            '</div></div>';
        });
        h += '</div>';
        el.innerHTML = h;
      }).withFailureHandler(function() {
        document.getElementById('notif-history').innerHTML = '<p class="text-gray-400 text-center">ไม่สามารถโหลดข้อมูลได้</p>';
      }).getNotifications();
    }

    function sendNotification(e) {
      e.preventDefault();
      var btn = document.getElementById('send-btn');
      btn.disabled = true;
      btn.textContent = 'กำลังส่ง...';

      var data = {
        title: document.getElementById('n-title').value.trim(),
        message: document.getElementById('n-message').value.trim(),
        recipientId: document.getElementById('n-recipient').value,
        sendLine: document.getElementById('n-line').checked
      };

      google.script.run.withSuccessHandler(function(result) {
        btn.disabled = false;
        btn.textContent = 'ส่งแจ้งเตือน';
        if (result && result.success) {
          showToast('ส่งแจ้งเตือนสำเร็จ');
          document.getElementById('notif-form').reset();
          loadPageData();
        } else {
          showToast(result && result.message ? result.message : 'ไม่สามารถส่งได้', true);
        }
      }).withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = 'ส่งแจ้งเตือน';
        showToast('เกิดข้อผิดพลาด: ' + err.message, true);
      }).sendNotification(data);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    window.onload = initPage;
  </script>
</body>
</html>
