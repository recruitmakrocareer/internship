<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ให้คะแนน KM - ระบบจัดการนักศึกษาฝึกงาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spinner { border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s; }
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    .modal-overlay { background: rgba(0,0,0,0.5); }
    input[type="range"] { -webkit-appearance: none; height: 8px; border-radius: 4px; background: #e5e7eb; outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #2563eb; cursor: pointer; }
  </style>
</head>
<body class="bg-gray-50">

  <div id="toast" class="hidden fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg toast"></div>

  <!-- Sidebar -->
  <div id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white shadow-lg z-30">
    <div class="p-6 border-b">
      <h1 class="text-lg font-bold text-blue-700">ระบบจัดการฝึกงาน</h1>
    </div>
    <nav class="p-4" id="nav-menu"></nav>
  </div>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-xl mx-4 max-h-[90vh] overflow-y-auto">
      <div class="p-6" id="modal-content"></div>
    </div>
  </div>

  <!-- Main -->
  <div class="ml-64">
    <div class="bg-white shadow-sm px-6 py-3 flex justify-between items-center sticky top-0 z-20">
      <h2 class="text-lg font-semibold">ให้คะแนน Knowledge Management</h2>
      <div class="flex items-center gap-4">
        <span id="user-name" class="text-sm text-gray-600"></span>
        <span id="user-role" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full"></span>
        <button onclick="logout()" class="text-sm text-red-600 hover:text-red-800">ออกจากระบบ</button>
      </div>
    </div>

    <div class="p-6" id="content">
      <div class="flex items-center justify-center h-64"><div class="spinner"></div></div>
    </div>
  </div>

  <script>
    var currentUser = null;
    var allSummaries = [];

    function initPage() {
      google.script.run.withSuccessHandler(function(user) {
        if (!user) { navigateTo('login'); return; }
        currentUser = user;
        document.getElementById('user-name').textContent = user.name;
        document.getElementById('user-role').textContent = getRoleLabel(user.role);
        buildNavMenu(user.role);
        loadData();
      }).withFailureHandler(function() { navigateTo('login'); }).getCurrentUser();
    }

    function navigateTo(page) {
      google.script.run.withSuccessHandler(function(url) { window.top.location.href = url + '?page=' + page; }).getScriptUrl();
    }
    function logout() { google.script.run.withSuccessHandler(function() { navigateTo('login'); }).logout(); }
    function getRoleLabel(role) { return { STUDENT: 'นักศึกษา', MENTOR: 'พี่เลี้ยง', ADMIN: 'ผู้ดูแลระบบ' }[role] || role; }

    function buildNavMenu(role) {
      var menus = {
        ADMIN: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'จัดการนักศึกษา', page: 'admin-students', icon: '👨‍🎓' },
          { label: 'จัดการพี่เลี้ยง', page: 'admin-mentors', icon: '👨‍🏫' },
          { label: 'จัดการ Roadmap', page: 'admin-roadmaps', icon: '🗺️' },
          { label: 'จัดการงาน', page: 'admin-assignments', icon: '📝' },
          { label: 'ผลประเมิน', page: 'admin-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'admin-resources', icon: '📚' },
          { label: 'แจ้งเตือน', page: 'admin-notifications', icon: '🔔' }
        ],
        STUDENT: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'โปรไฟล์', page: 'student-profile', icon: '👤' },
          { label: 'Training Passport', page: 'training-passport', icon: '📋' },
          { label: 'Knowledge Management', page: 'knowledge-management', icon: '📖' },
          { label: 'Roadmap', page: 'student-roadmap', icon: '🗺️' },
          { label: 'งานที่ได้รับ', page: 'student-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'student-evaluations', icon: '⭐' },
          { label: 'แหล่งความรู้', page: 'student-resources', icon: '📚' }
        ],
        MENTOR: [
          { label: 'แดชบอร์ด', page: 'dashboard', icon: '📊' },
          { label: 'นักศึกษาในดูแล', page: 'mentor-students', icon: '👨‍🎓' },
          { label: 'Training Passport', page: 'mentor-training-passport', icon: '📋' },
          { label: 'ให้คะแนน KM', page: 'mentor-km-scoring', icon: '📖' },
          { label: 'ตรวจงาน', page: 'mentor-assignments', icon: '📝' },
          { label: 'ประเมินผล', page: 'mentor-evaluations', icon: '⭐' }
        ]
      };
      var items = menus[role] || [];
      var nav = document.getElementById('nav-menu');
      nav.innerHTML = items.map(function(item) {
        var active = item.page === 'mentor-km-scoring' ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-gray-600 hover:bg-gray-50';
        return '<a href="#" onclick="navigateTo(\'' + item.page + '\')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg mb-1 text-sm ' + active + '">' +
          '<span>' + item.icon + '</span><span>' + item.label + '</span></a>';
      }).join('');
    }

    function showToast(msg, isError) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg toast ' + (isError ? 'bg-red-500 text-white' : 'bg-green-500 text-white');
      setTimeout(function() { toast.className = 'hidden'; }, 3000);
    }

    function loadData() {
      var content = document.getElementById('content');
      content.innerHTML = '<div class="flex items-center justify-center h-64"><div class="spinner"></div></div>';

      google.script.run.withSuccessHandler(function(result) {
        if (result && result.success) {
          allSummaries = result.data || [];
          renderSummaries();
        } else {
          content.innerHTML = '<div class="text-center py-16"><p class="text-gray-500">ไม่พบข้อมูล</p></div>';
        }
      }).withFailureHandler(function() {
        content.innerHTML = '<p class="text-red-500 text-center py-8">ไม่สามารถโหลดข้อมูลได้</p>';
      }).getAllKnowledgeSummaries();
    }

    function renderSummaries() {
      var content = document.getElementById('content');

      // Filter to students who have selected a presentation topic
      var withTopic = allSummaries.filter(function(s) {
        return s.km && s.km.selectedTopic;
      });
      var withoutTopic = allSummaries.filter(function(s) {
        return !s.km || !s.km.selectedTopic;
      });

      var html = '<div class="mb-6">' +
        '<h3 class="text-xl font-bold text-gray-800 mb-1">ให้คะแนน Knowledge Management Presentation</h3>' +
        '<p class="text-gray-500 text-sm">ให้คะแนนการนำเสนอ KM ของนักศึกษา (25% ของคะแนนรวม)</p></div>';

      // Students with selected topic
      if (withTopic.length > 0) {
        html += '<h4 class="font-semibold text-gray-700 mb-3">นักศึกษาที่เลือกหัวข้อนำเสนอแล้ว (' + withTopic.length + ' คน)</h4>' +
          '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">';

        for (var i = 0; i < withTopic.length; i++) {
          var s = withTopic[i];
          var km = s.km;
          var hasScore = km.presentationScore !== null && km.presentationScore !== undefined;

          html += '<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 hover:shadow-md transition">' +
            '<div class="flex items-center gap-3 mb-3">' +
            '<div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center text-lg">👤</div>' +
            '<div><h4 class="font-semibold text-gray-800 text-sm">' + escapeHtml(s.name) + '</h4>' +
            '<p class="text-xs text-gray-400">' + escapeHtml(s.studentId || '') + '</p></div></div>' +
            '<div class="mb-3">' +
            '<p class="text-xs text-gray-400 mb-1">หัวข้อนำเสนอ</p>' +
            '<p class="text-sm font-medium text-purple-700">' + escapeHtml(km.selectedTopic.topicName) + '</p></div>' +
            '<div class="flex items-center justify-between mb-3">' +
            '<div><p class="text-xs text-gray-400">KM เสร็จ</p><p class="text-sm font-semibold">' + km.completedTopics + '/6 หัวข้อ</p></div>' +
            (hasScore ? '<div class="text-right"><p class="text-xs text-gray-400">คะแนน</p><p class="text-xl font-bold text-green-600">' + km.presentationScore + '<span class="text-sm text-gray-400">/100</span></p></div>' : '') +
            '</div>' +
            '<button onclick="openScoringForm(\'' + s.userId + '\', ' + i + ')" class="w-full py-2 rounded-lg text-sm font-medium transition ' +
            (hasScore ? 'bg-gray-100 text-gray-600 hover:bg-gray-200">ดู/แก้ไขคะแนน' : 'bg-blue-600 text-white hover:bg-blue-700">ให้คะแนน') +
            '</button></div>';
        }

        html += '</div>';
      }

      // Students without selected topic
      if (withoutTopic.length > 0) {
        html += '<h4 class="font-semibold text-gray-500 mb-3 mt-6">นักศึกษาที่ยังไม่เลือกหัวข้อ (' + withoutTopic.length + ' คน)</h4>' +
          '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">';

        for (var j = 0; j < withoutTopic.length; j++) {
          var sw = withoutTopic[j];
          var kwm = sw.km;

          html += '<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 opacity-60">' +
            '<div class="flex items-center gap-3 mb-3">' +
            '<div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-lg">👤</div>' +
            '<div><h4 class="font-semibold text-gray-800 text-sm">' + escapeHtml(sw.name) + '</h4>' +
            '<p class="text-xs text-gray-400">' + escapeHtml(sw.studentId || '') + '</p></div></div>' +
            '<p class="text-xs text-gray-400">KM เสร็จ: ' + (kwm ? kwm.completedTopics : 0) + '/6 หัวข้อ</p>' +
            '<p class="text-xs text-orange-500 mt-1">ยังไม่เลือกหัวข้อนำเสนอ</p></div>';
        }

        html += '</div>';
      }

      if (allSummaries.length === 0) {
        html += '<div class="text-center py-16"><div class="text-4xl mb-4">📖</div><p class="text-gray-500">ยังไม่มีข้อมูลนักศึกษา</p></div>';
      }

      content.innerHTML = html;
    }

    function openScoringForm(userId, idx) {
      var modal = document.getElementById('modal');
      var modalContent = document.getElementById('modal-content');

      var withTopic = allSummaries.filter(function(s) { return s.km && s.km.selectedTopic; });
      var student = withTopic[idx];

      var html = '<div class="flex items-center justify-between mb-6">' +
        '<div><h3 class="text-xl font-bold text-gray-800">ให้คะแนนการนำเสนอ</h3>' +
        '<p class="text-sm text-gray-500">' + escapeHtml(student.name) + ' - ' + escapeHtml(student.km.selectedTopic.topicName) + '</p></div>' +
        '<button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button></div>';

      var criteria = [
        { id: 'format', label: 'รูปแบบ Presentation', weight: '15%' },
        { id: 'content', label: 'เนื้อหา', weight: '40%' },
        { id: 'timeManagement', label: 'ความเหมาะสมของเวลา', weight: '15%' },
        { id: 'presentationSkill', label: 'ทักษะการนำเสนอ', weight: '15%' },
        { id: 'qaSkill', label: 'คำตอบและไหวพริบ', weight: '15%' }
      ];

      html += '<div class="space-y-5">';

      for (var c = 0; c < criteria.length; c++) {
        var cr = criteria[c];
        html += '<div>' +
          '<div class="flex items-center justify-between mb-2">' +
          '<label class="text-sm font-semibold text-gray-700">' + cr.label + ' <span class="text-gray-400 font-normal">(น้ำหนัก ' + cr.weight + ')</span></label>' +
          '<span id="score-display-' + cr.id + '" class="text-lg font-bold text-blue-600">5</span></div>' +
          '<div class="flex items-center gap-3">' +
          '<span class="text-xs text-gray-400">1</span>' +
          '<input type="range" id="score-' + cr.id + '" min="1" max="10" value="5" class="flex-1" oninput="updateScoreDisplay(\'' + cr.id + '\')">' +
          '<span class="text-xs text-gray-400">10</span></div></div>';
      }

      html += '</div>' +
        '<div class="mt-6 bg-blue-50 rounded-xl p-4 border border-blue-200">' +
        '<div class="flex items-center justify-between">' +
        '<span class="text-sm font-semibold text-gray-700">คะแนนรวม (ถ่วงน้ำหนัก)</span>' +
        '<span id="total-score" class="text-2xl font-bold text-blue-600">50/100</span></div>' +
        '<p class="text-xs text-gray-400 mt-1">สูตร: รูปแบบ*0.15 + เนื้อหา*0.40 + เวลา*0.15 + ทักษะ*0.15 + ไหวพริบ*0.15 = คะแนนเต็ม 10, คูณ 10 = คะแนนเต็ม 100</p></div>' +
        '<div class="flex gap-3 mt-6">' +
        '<button onclick="submitScore(\'' + userId + '\')" class="flex-1 bg-blue-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-blue-700 transition">บันทึกคะแนน</button>' +
        '<button onclick="closeModal()" class="px-6 py-2.5 border border-gray-300 rounded-lg text-sm text-gray-600 hover:bg-gray-50 transition">ยกเลิก</button></div>';

      modalContent.innerHTML = html;
      modal.classList.remove('hidden');

      // Calculate initial total
      calculateTotal();
    }

    function updateScoreDisplay(id) {
      var val = document.getElementById('score-' + id).value;
      document.getElementById('score-display-' + id).textContent = val;
      calculateTotal();
    }

    function calculateTotal() {
      var format = Number(document.getElementById('score-format').value);
      var content = Number(document.getElementById('score-content').value);
      var time = Number(document.getElementById('score-timeManagement').value);
      var skill = Number(document.getElementById('score-presentationSkill').value);
      var qa = Number(document.getElementById('score-qaSkill').value);

      var weighted = (format * 0.15) + (content * 0.40) + (time * 0.15) + (skill * 0.15) + (qa * 0.15);
      var total = Math.round(weighted * 10);

      document.getElementById('total-score').textContent = total + '/100';
    }

    function submitScore(userId) {
      var scores = {
        format: Number(document.getElementById('score-format').value),
        content: Number(document.getElementById('score-content').value),
        timeManagement: Number(document.getElementById('score-timeManagement').value),
        presentationSkill: Number(document.getElementById('score-presentationSkill').value),
        qaSkill: Number(document.getElementById('score-qaSkill').value)
      };

      google.script.run.withSuccessHandler(function(result) {
        if (result && result.success) {
          showToast('บันทึกคะแนนสำเร็จ - คะแนนรวม: ' + result.data.totalScore + '/100');
          closeModal();
          loadData();
        } else {
          showToast(result ? result.message : 'เกิดข้อผิดพลาด', true);
        }
      }).withFailureHandler(function() {
        showToast('เกิดข้อผิดพลาด', true);
      }).scorePresentationKM(userId, currentUser.userId, scores);
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    window.onload = initPage;
  </script>
</body>
</html>
